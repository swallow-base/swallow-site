<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>語法スラ練 演習</title>
<style>
:root{--bg:#faf9f7;--panel:#fff;--ink:#1c1b19;--sub:#6b6862;--line:#ddd9d2;--accent:#8c2f2f;--soft:#f3e7e5;--ok:#2f6b45;--okbg:#e6f0e9;--ng:#a33;--ngbg:#f7e4e4;--btn:#f3f1ed;--on:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161a;--panel:#201f24;--ink:#eceae6;--sub:#9c9890;--line:#34323a;--accent:#d98a8a;--soft:#3a2a2c;--ok:#8fd0a8;--okbg:#25352c;--ng:#e59a9a;--ngbg:#3a2628;--btn:#2a292f;--on:#17161a}}
:root[data-theme="dark"]{--bg:#17161a;--panel:#201f24;--ink:#eceae6;--sub:#9c9890;--line:#34323a;--accent:#d98a8a;--soft:#3a2a2c;--ok:#8fd0a8;--okbg:#25352c;--ng:#e59a9a;--ngbg:#3a2628;--btn:#2a292f;--on:#17161a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;line-height:1.75;-webkit-text-size-adjust:100%}
.wrap{max-width:700px;margin:0 auto;padding:18px 16px 70px}
h1{font-size:1rem;margin:0;font-weight:600}
.sub{color:var(--sub);font-size:.8rem}
header{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:6px;margin-bottom:14px}
.tab{background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:9px 6px;font:inherit;font-size:.82rem;color:inherit;cursor:pointer;text-align:center}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:14px}
.verb{font-size:2.3rem;font-weight:600;text-align:center;margin:6px 0 2px;font-family:Georgia,"Times New Roman",serif}
.ask{text-align:center;color:var(--sub);font-size:.82rem;margin-bottom:16px}
.sent{font-family:Georgia,"Times New Roman",serif;font-size:1.16rem;line-height:1.8;margin:10px 0 18px;text-align:center}
.blank{border-bottom:1.5px solid var(--accent);display:inline-block;min-width:4.2em;text-align:center;margin:0 .2em;color:var(--accent);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.grid.two{grid-template-columns:1fr 1fr}
button{font:inherit;color:inherit;cursor:pointer}
.opt{background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:12px 8px;font-size:.9rem;text-align:center;transition:background .12s}
.opt:hover{background:var(--soft)}
.opt.sel{background:var(--soft);border-color:var(--accent);font-weight:600}
.opt:disabled{cursor:default;opacity:.5}
.opt.correct{background:var(--okbg);border-color:var(--ok);color:var(--ok);opacity:1;font-weight:600}
.opt.wrong{background:var(--ngbg);border-color:var(--ng);color:var(--ng);opacity:1}
.mono{font-family:Georgia,serif;letter-spacing:.04em}
.go{width:100%;margin-top:14px;background:var(--accent);color:var(--on);border:0;border-radius:8px;padding:13px;font-size:.95rem;font-weight:600}
.go.ghost{background:transparent;border:1px solid var(--line);color:var(--sub);font-weight:400;font-size:.85rem}
.reveal{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.pat{display:grid;grid-template-columns:5em 1fr;gap:4px 12px;margin-bottom:9px;font-size:.9rem}
.pat b{font-family:Georgia,serif;color:var(--accent);letter-spacing:.04em;font-weight:600}
.pat .ex{grid-column:2;font-family:Georgia,serif;font-size:.85rem;color:var(--sub)}
.form{text-align:center;font-family:Georgia,serif;font-size:1.5rem;color:var(--accent);margin:4px 0 6px;font-weight:600}
.bar{display:flex;justify-content:space-between;font-size:.78rem;color:var(--sub);margin-bottom:10px;flex-wrap:wrap;gap:8px}
.done{text-align:center}
.big{font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums}
.list{text-align:left;margin-top:16px;font-size:.86rem}
.list li{margin-bottom:6px}
.ja{color:var(--sub);font-size:.85rem}
.tag{display:inline-block;font-family:Georgia,serif;font-size:.75rem;background:var(--soft);color:var(--accent);border-radius:4px;padding:1px 7px;margin-right:6px;letter-spacing:.04em}
.gate{text-align:center;padding:10px 4px}
.qn{font-size:.83rem;color:var(--sub);margin:16px 0 8px;font-weight:600}
.tiny{display:block;font-size:.7rem;opacity:.7;font-weight:400;margin-top:1px}
.prompt{border:1px dashed var(--line);border-radius:8px;padding:11px;text-align:center;color:var(--sub);font-size:.83rem}
</style>
</head>
<body>
<div class="wrap">

 {v:"taste",ps:[P("SVC","S が C の味がする","This soup tastes a little salty.","このスープは少し塩辛い。"),P("SVO","S が O を味わう","She tasted the sauce before serving it.","彼女は出す前にソースを味見した。")]},
 {v:"smell",ps:[P("SVC","S が C のにおいがする","The kitchen smelled sweet.","台所は甘いにおいがした。"),P("SVO","S が O のにおいをかぐ","He smelled the flowers one by one.","彼は花を一つずつかいでいった。")]},

 {v:"go",ps:[P("SV","S が行く","She goes to the library every Sunday.","彼女は毎週日曜に図書館へ行く。"),P("SVC","S が C になる（悪い方向へ）","The milk went bad in a day.","牛乳は一日で悪くなった。")]},
 {v:"fall",ps:[P("SV","S が落ちる","A branch fell onto the roof.","枝が屋根に落ちた。"),P("SVC","S が C になる","The room fell silent at once.","部屋は一瞬で静まりかえった。")]},

 {v:"see",ps:[P("SVO","S が O を見る","I saw the same poster twice.","同じ掲示を二度見た。"),P("SVOC","S が O が C するのを見る","I saw a girl eating an apple.","女の子がりんごを食べているのを見た。")]},
 {v:"hear",ps:[P("SVO","S が O を聞く","We heard the news last night.","昨夜そのニュースを聞いた。"),P("SVOC","S が O が C するのが聞こえる","I heard my name called.","自分の名前が呼ばれるのが聞こえた。")]},
 {v:"watch",ps:[P("SVO","S が O を見る","He watched the game to the end.","彼は最後まで試合を見た。"),P("SVOC","S が O が C するのを見る","She watched the suspect leave the bank.","彼女は容疑者が銀行を出るのを見た。")]},

 {v:"want",ps:[P("SVO","S が O を欲しがる","She wants a quieter room.","彼女はもっと静かな部屋を求めている。"),P("SVOC","S が O に〜してほしい","I want you to read this first.","まずこれを読んでほしい。")]},
 {v:"help",ps:[P("SVO","S が O を手伝う","Could you help me with my homework?","宿題を手伝ってくれませんか。"),P("SVOC","S が O が〜するのを手伝う","He helped her peel the onions.","彼は彼女がタマネギの皮をむくのを手伝った。")]},
 {v:"regard",ps:[P("SVOC","S が O を C とみなす","Many regard him as the finest writer of the period.","多くの人が彼をその時代で最も優れた作家とみなしている。")]},
 {v:"consider",ps:[P("SVO","S が O について考える","We considered several options.","私たちはいくつかの選択肢を検討した。"),P("SVOC","S が O を C とみなす","They considered the plan a failure.","彼らはその計画を失敗とみなした。")]},
 {v:"describe",ps:[P("SVO","S が O を描写する","She described the village in detail.","彼女はその村を詳しく描写した。"),P("SVOC","S が O を C と表現する","Critics described the film as dull.","批評家はその映画を退屈だと評した。")]},
 {v:"run",ps:[P("SV","S が走る","He runs along the river every morning.","彼は毎朝川沿いを走っている。"),P("SVO","S が O を経営する","Her family runs a small inn.","彼女の家族は小さな宿を営んでいる。")]},
];

/* ═══════ 状態 ═══════ */
const FORMS=["SV","SVC","SVO","SVOO","SVOC"];
const KEY="tsubame-drill-v2";
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const eq=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}};
const save=o=>{try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}};
const LABELS=["自他の判別と産出","使い分け","空所補充","文型を選ぶ","和訳を作る"];
const NOTES=["判別してから、正しい形を声に出す","紛らわしい二語の使い分けと活用","私大型。前置詞と「何も入らない」の四択","SV / SVC / SVO / SVOO / SVOC から複数選択","12問。自己申告で採点"];
let mode=0,q=[],cur=null,phase="",sel=[],picked=null,log=[],n=0,hit=0,gated=false;

function start(){
  sel=[];picked=null;log=[];n=0;hit=0;gated=false;cur=null;
  if(mode===0) q=shuffle(VT.slice());
  else if(mode===1) q=shuffle(PR.slice());
  else if(mode===2){
    if(!load().unlocked){gated=true;render();return;}
    q=shuffle(CL.slice()).slice(0,16);
  }
  else if(mode===3) q=shuffle(VP.slice());
  else{const all=[];VP.forEach(x=>x.ps.forEach(p=>all.push({v:x.v,...p})));q=shuffle(all).slice(0,12);}
  next();
}
function next(){cur=q.shift();sel=[];picked=null;phase="q";render();}
function miss(x){q.push(x);if(!log.includes(x))log.push(x);}

function render(){
  const app=document.getElementById("app");
  document.getElementById("score").textContent=gated?"":(n?`${hit} / ${n}　残り ${q.length}`:(cur?`残り ${q.length+1}`:""));
  document.getElementById("chips").textContent=NOTES[mode];

  if(gated){
    app.innerHTML=`<div class="card gate">
      <div style="font-size:.92rem;margin-bottom:10px">先に「自他の判別と産出」を一巡してください。</div>
      <div class="sub">このモードには誤りの前置詞が選択肢に並びます。正しい形が口から出るようになる前に取り組むと、誤った形の印象が残ることがあります。</div>
      <button class="go ghost" id="force">それでも始める</button></div>`;
    app.querySelector("#force").onclick=()=>{gated=false;q=shuffle(CL.slice()).slice(0,16);next()};
    return;
  }
  if(!cur){summary(app);return;}

  /* ── 判別・前置詞・和訳を三問一括 ── */
  if(mode===0){
    const vi=cur.t==="vi", ok1=picked===cur.t;
    const showQ2 = picked==="vi";
    const cls=t=>{let c="opt";
      if(phase==="a"){ if(t===cur.t)c+=" correct"; else if(t===picked)c+=" wrong"; }
      else if(t===picked)c+=" sel";
      return c};
    app.innerHTML=`<div class="card">
      <div class="verb">${cur.v}</div>

      <div class="qn">Q1　この動詞の直後には？</div>
      <div class="grid two">
        <button class="${cls("vt")}" ${phase==="a"?"disabled":""} data-t="vt">目的語がくる<span class="tiny">他動詞</span></button>
        <button class="${cls("vi")}" ${phase==="a"?"disabled":""} data-t="vi">前置詞がくる<span class="tiny">自動詞</span></button>
      </div>

      ${picked?`<div class="qn">${showQ2?"Q2　入る前置詞は？":"Q2　── （他動詞を選んだので省略）"}</div>
        ${showQ2?`<div class="prompt">思い浮かべる</div>`:""}
        <div class="qn">Q3　このフレーズを和訳すると？</div>
        <div class="prompt">思い浮かべる</div>`:""}

      ${picked&&phase!=="a"?`<button class="go">解答を見る</button>`:""}

      ${phase==="a"?`<div class="reveal">
        <div class="pat"><b>Q1</b><span>${vi?"前置詞がくる（自動詞）":"目的語がくる（他動詞）"}　${ok1?"○":"×"}</span></div>
        <div class="pat"><b>Q2</b><span>${vi?(cur.prep?`<span class="mono">${cur.prep}</span>`:"前置詞をとらない（目的語も不要）"):"前置詞は不要"}</span></div>
        <div class="pat"><b>Q3</b><span>${cur.m}</span></div>
        <div class="form">${cur.form}</div>
        <div class="grid two" style="margin-top:14px">
          <button class="opt" data-ok="1">Q2・Q3 とも言えた</button>
          <button class="opt" data-ok="0">詰まった</button>
        </div></div>`:""}
    </div>`;
    if(phase==="q"){
      app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{picked=b.dataset.t;render()});
      const g=app.querySelector(".go"); if(g) g.onclick=()=>{
        n++; if(ok1)hit++; else miss(cur);
        phase="a"; render();};
    } else app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      n++; if(b.dataset.ok==="1")hit++; else miss(cur); next();});
    return;
  }

  /* ── 使い分け ── */
  if(mode===1){
    const cls=o=>{let c="opt mono";if(phase==="a"){if(o===cur.a)c+=" correct";else if(o===picked)c+=" wrong";}return c};
    app.innerHTML=`<div class="card">
      <div class="ask">${cur.ja}</div>
      <div class="sent">${cur.s[0]} <span class="blank">${phase==="a"?cur.a:"&nbsp;"}</span> ${cur.s[1]}</div>
      <div class="grid two">${cur.o.map(o=>`<button class="${cls(o)}" ${phase==="a"?"disabled":""} data-o="${o}">${o}</button>`).join("")}</div>
      ${phase==="a"?`<div class="reveal"><div class="sub">${cur.n}</div><button class="go">次へ</button></div>`:""}
    </div>`;
    if(phase==="q") app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      picked=b.dataset.o;n++;
      if(picked===cur.a)hit++;else miss(cur);
      phase="a";render();});
    else app.querySelector(".go").onclick=next;
    return;
  }

  /* ── 空所補充 ── */
  if(mode===2){
    const cls=o=>{let c="opt";if(phase==="a"){if(cur.a.includes(o))c+=" correct";else if(o===picked)c+=" wrong";}return c};
    app.innerHTML=`<div class="card">
      <div class="ask">空所に入るものを選ぶ</div>
      <div class="sent">${cur.s[0]} <span class="blank">${phase==="a"?(cur.a[0]===NB?"—":cur.a[0]):"&nbsp;"}</span> ${cur.s[1]}</div>
      <div class="grid two">${cur.o.map(o=>`<button class="${cls(o)}" ${phase==="a"?"disabled":""} data-o="${o}">${o===NB?o:`<span class="mono">${o}</span>`}</button>`).join("")}</div>
      ${phase==="a"?`<div class="reveal"><div class="sub">${cur.n}</div><button class="go">次へ</button></div>`:""}
    </div>`;
    if(phase==="q") app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      picked=b.dataset.o;n++;
      if(cur.a.includes(picked))hit++;else miss(cur);
      phase="a";render();});
    else app.querySelector(".go").onclick=next;
    return;
  }

  /* ── 文型を選ぶ ── */
  if(mode===3){
    const right=cur.ps.map(p=>p.p);
    const cls=f=>{let c="opt mono";
      if(phase==="a"){if(right.includes(f))c+=" correct";else if(sel.includes(f))c+=" wrong";}
      else if(sel.includes(f))c+=" sel";return c};
    app.innerHTML=`<div class="card">
      <div class="verb">${cur.v}</div>
      <div class="ask">この動詞がとりうる主な文型を全て選ぶ</div>
      <div class="grid">${FORMS.map(f=>`<button class="${cls(f)}" ${phase==="a"?"disabled":""} data-f="${f}">${f}</button>`).join("")}</div>
      ${phase==="q"?`<button class="go">決定</button>`:`<div class="reveal">
        <div class="ask" style="margin-bottom:12px">それぞれの和訳の型</div>
        ${cur.ps.map(p=>`<div class="pat"><b>${p.p}</b><span>${p.ja}</span><span class="ex">${p.en}</span></div>`).join("")}
        <button class="go">次へ</button></div>`}
    </div>`;
    if(phase==="q"){
      app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
        sel=sel.includes(b.dataset.f)?sel.filter(x=>x!==b.dataset.f):[...sel,b.dataset.f];render();});
      app.querySelector(".go").onclick=()=>{
        if(!sel.length)return;n++;
        if(eq(sel,right))hit++;else miss(cur);
        phase="a";render();};
    } else app.querySelector(".go").onclick=next;
    return;
  }

  /* ── 和訳を作る ── */
  app.innerHTML=`<div class="card">
    <div class="ask">和訳を思い浮かべる</div>
    <div class="sent">${cur.en}</div>
    ${phase==="q"?`<button class="go">解答を見る</button>`:`<div class="reveal">
      <div style="margin-bottom:10px"><span class="tag">${cur.p}</span><span class="sub">${cur.ja}</span></div>
      <div>${cur.jaex}</div>
      <div class="grid two" style="margin-top:16px">
        <button class="opt" data-ok="1">言えた</button>
        <button class="opt" data-ok="0">詰まった</button>
      </div></div>`}
  </div>`;
  if(phase==="q") app.querySelector(".go").onclick=()=>{phase="a";render()};
  else app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    n++;if(b.dataset.ok==="1")hit++;else miss(cur);next();});
}

function summary(app){
  const acc=n?Math.round(hit/n*100):0;
  const first=mode===0&&!load().unlocked;
  if(mode===0) save({...load(),unlocked:true});
  const u=[...new Set(log)];
  app.innerHTML=`<div class="card done">
    <div class="sub">この回の成績</div>
    <div class="big">${acc}<span style="font-size:1rem">%</span></div>
    <div class="sub">${hit} / ${n}</div>
    ${first?`<div class="sub" style="margin-top:8px">「空所補充」が使えるようになりました。</div>`:""}
    ${u.length?`<div class="list"><div class="sub">詰まったもの</div><ul>${u.map(x=>
      mode===0?`<li><b class="mono">${x.form}</b> ── ${x.m}</li>`
      :mode===1?`<li><b class="mono">${x.a}</b> ── ${x.ja}</li>`
      :mode===2?`<li>${x.s[0]} <b class="mono">${x.a[0]===NB?"（なし）":x.a[0]}</b> ${x.s[1]}</li>`
      :mode===3?`<li><b>${x.v}</b> ── ${x.ps.map(p=>p.p).join(" ・ ")}</li>`
      :`<li>${x.en}<br><span class="ja">${x.jaex}</span></li>`).join("")}</ul></div>`
    :`<div class="sub" style="margin-top:10px">詰まりなし。</div>`}
    <button class="go">もう一度</button>
  </div>`;
  app.querySelector(".go").onclick=start;
}

const tabs=document.getElementById("tabs");
LABELS.forEach((label,i)=>{
  const b=document.createElement("button");
  b.className="tab"+(i===mode?" on":"");b.textContent=label;
  b.onclick=()=>{mode=i;[...tabs.children].forEach((c,j)=>c.classList.toggle("on",j===i));start()};
  tabs.appendChild(b);
});
start();
</script>
