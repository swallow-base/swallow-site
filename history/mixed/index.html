:root{

body{

header.top{display:flex;align-items:baseline;gap:14px;padding:8px 2px 20px;border-bottom:2px solid var(--ink);margin-bottom:26px}
header.top .mark{

  background:var(--seal);padding:7px 9px;border-radius:3px;letter-spacing:.12em;line-height:1.3;

}
header.top h1{font-family:"Noto Serif JP",serif;font-weight:700;font-size:21px;letter-spacing:.04em}

header.top .home-link{margin-left:auto;align-self:center;font-size:12px;color:var(--seal);text-decoration:none;border:1px solid var(--line);padding:6px 12px;border-radius:6px;white-space:nowrap;font-weight:600;letter-spacing:.04em;transition:.12s}
header.top .home-link:hover{background:#faf0ec;border-color:var(--seal)}

.lead{font-size:13.5px;color:var(--ink-soft);margin-bottom:22px;max-width:60ch}

  font-family:inherit;color:inherit;
}
.mode-card:hover{border-color:var(--ink);transform:translateY(-1px)}

.mode-card .code{font-family:"Noto Serif JP",serif;font-weight:700;font-size:18px;color:var(--seal);min-width:30px;padding-top:1px}
.mode-card .body .t{font-weight:700;font-size:15px;margin-bottom:3px}

.btn-back{font-family:inherit;font-size:12.5px;background:none;border:none;color:var(--ink-soft);cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.btn-back:hover{color:var(--ink)}
.progress{font-size:12px;color:var(--ink-soft);font-family:"Noto Serif JP",serif;letter-spacing:.05em}
.score-tag{font-size:12px;color:var(--seal);font-weight:700}

.opts{display:grid;gap:9px;margin-top:18px}
.opt{

  padding:12px 15px;cursor:pointer;font-size:14.5px;color:var(--ink);transition:.12s;width:100%;display:flex;gap:10px;align-items:center;
}
.opt .mk{font-family:"Noto Serif JP",serif;color:var(--ink-soft);font-size:13px;min-width:18px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:focus-visible{outline:2px solid var(--seal);outline-offset:1px}
.opt:disabled{cursor:default}
.opt.correct{background:#eef3ea;border-color:var(--green);color:#33421f}
.opt.wrong{background:#f6e9e6;border-color:var(--seal);color:#6e2a1e}
.opt.dim{opacity:.5}
.opt.dk{color:var(--ink-soft)}
.opt.dk .mk{color:var(--seal);font-weight:700}
.opt.selected{border-color:var(--seal);background:#faf0ec;box-shadow:inset 0 0 0 2px rgba(158,61,46,.22)}

.opt .badge.ans{background:#3f7d52;color:#fff}
.opt .badge+.badge{margin-left:6px}

.qblock{border-top:1px dashed var(--line);padding-top:16px;margin-top:16px}
.qblock:first-of-type{border-top:none;padding-top:4px;margin-top:8px}

.q-ask .q-no{color:var(--seal);font-family:"Noto Serif JP",serif;margin-right:6px}

.explain{margin-top:18px;background:#fbf6ea;border-left:3px solid var(--gold);border-radius:0 6px 6px 0;padding:13px 15px;font-size:13px;line-height:1.8;color:var(--ink-soft)}

.explain .ttl{font-family:"Noto Serif JP",serif;font-weight:700;color:var(--gold);font-size:11px;letter-spacing:.14em;display:block;margin-bottom:5px}

.verdict{display:flex;align-items:center;gap:9px;font-family:"Noto Serif JP",serif;font-weight:700;font-size:18px;padding:11px 18px;border-radius:7px;margin-top:18px;letter-spacing:.1em}

.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{font-family:inherit;font-size:14px;font-weight:700;border-radius:6px;padding:11px 22px;cursor:pointer;border:1px solid var(--ink);transition:.12s}

.btn-primary:hover{background:#000}

.btn:focus-visible{outline:2px solid var(--seal);outline-offset:2px}

.done{text-align:center;padding:30px 10px}
.done .big{font-family:"Noto Serif JP",serif;font-size:34px;font-weight:700;margin:10px 0}
.done .lbl{font-size:12px;letter-spacing:.18em;color:var(--gold);font-family:"Noto Serif JP",serif}
.done p{font-size:13.5px;color:var(--ink-soft);margin:14px 0 24px}
.wrong-list{text-align:left;background:#fbf6ea;border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:18px auto;max-width:520px}
.wrong-list .wl-ttl{font-family:"Noto Serif JP",serif;font-weight:700;font-size:13px;color:var(--seal);margin-bottom:10px}
.wrong-list ul{list-style:none}
.wrong-list li{font-size:14px;padding:7px 2px;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.wrong-list li:last-child{border-bottom:none}
.wrong-list li .rd{font-size:12px;color:var(--ink-soft);white-space:nowrap}

footer{margin-top:40px;font-size:11px;color:var(--ink-soft);text-align:center;line-height:1.7;border-top:1px solid var(--line);padding-top:16px}

    <p class="lead">中国・ギリシア＝ローマ・イスラーム・中世ヨーロッパ・ルネサンス・17〜18世紀ヨーロッパの6つの演習の語句を、まとめてシャッフルして出題します。正解となる語は教材資料の範囲に限定しています。誤答の選択肢には教材外の語も含まれます（見慣れない語は誤答です）。文化圏・時代をまたいだ混同を防ぐ練習です。</p>

<script>
/* ===================================================================
   データ：中国・ギリシア＝ローマ・イスラーム・中世ヨーロッパ・ルネサンス・17〜18世紀ヨーロッパの
   各演習アプリのデータを統合したもの（ビルドスクリプトで自動生成）。
   mem … 所属（文化圏 r と区分 s の組。複数所属あり）。
   group … モードA誤答の系統キー。cross … 地域横断の系統キー。
   =================================================================== */
const DATA=[{"id":"cn_kaishiso","term":"華夷思想","read":"かいしそう","region":"中国","mem":[{"r":"中国","s":"春秋戦国"}],"type":"概念","group":"cn:思想","desc":"自らを文化の中心とみなし、生活習慣の異なる周辺の民を「夷狄」として低く見る考え方。"},{"id":"cn_shoshi","term":"諸子百家","read":"しょしひゃっか","region":"中国","mem":[{"r":"中国","s":"春秋戦国"}],"type":"概念","group":"cn:学派","desc":"春秋・戦国時代に現れた、思想や技能を生かして実力を示そうとした多様な思想家・学派の総称。"},{"id":"cn_juka","term":"儒家","read":"じゅか","region":"中国","mem":[{"r":"中国","s":"春秋戦国"}],"type":"概念","group":"cn:学派","desc":"孔子を祖とする学派。徳による統治を理想とし、礼の実践を通じて親愛を社会秩序へ広げることを説いた。"},{"id":"cn_koushi","term":"孔子","read":"こうし","region":"中国","mem":[{"r":"中国","s":"春秋戦国"}],"type":"人物","group":"cn:人物","desc":"春秋時代の思想家で、儒家の祖。仁と礼による道徳を説いた。","work":"cn_rongo"},{"id":"cn_rongo","term":"論語","read":"ろんご","region":"中国","mem":[{"r":"中国","s":"春秋戦国"}],"type":"書物","group":"cn:経典","desc":"孔子とその弟子の言行をまとめた書物。","note":"孔子個人の著作ではなく、のちに弟子たちが編纂したもの。"},{"id":"cn_moushi","term":"孟子","read":"もうし","region":"中国","mem":[{"r":"中国","s":"春秋戦国"}],"type":"人物","group":"cn:人物","desc":"戦国時代の儒家。性善説を唱え、王朝交替を認める易姓革命の論理を説いた。"},{"id":"cn_seizen","term":"性善説","read":"せいぜんせつ","region":"中国","mem":[{"r":"中国","s":"春秋戦国"}],"type":"概念","group":"cn:学説","desc":"人の本性は善であるとする孟子の主張。"},{"id":"cn_junshi","term":"荀子","read":"じゅんし","region":"中国","mem":[{"r":"中国","s":"春秋戦国"}],"type":"人物","group":"cn:人物","desc":"戦国時代の儒家。性悪説を唱え、礼による規律の維持を強調した。"},{"id":"cn_seiaku","term":"性悪説","read":"せいあくせつ","region":"中国","mem":[{"r":"中国","s":"春秋戦国"}],"type":"概念","group":"cn:学説","desc":"人の本性は悪であるとし、礼による矯正を説く荀子の主張。"},{"id":"cn_ekisei","term":"易姓革命","read":"えきせいかくめい","region":"中国","mem":[{"r":"中国","s":"春秋戦国"}],"type":"概念","group":"cn:思想","desc":"天命が改まれば王朝が交替するという考え方。孟子が説いた。"},{"id":"cn_houka","term":"法家","read":"ほうか","region":"中国","mem":[{"r":"中国","s":"春秋戦国"}],"type":"概念","group":"cn:学派","desc":"法と刑罰による統治を説いた学派。商鞅・韓非・李斯らが代表。"},{"id":"cn_rishi","term":"李斯","read":"りし","region":"中国","mem":[{"r":"中国","s":"春秋戦国"}],"type":"人物","group":"cn:人物","desc":"法家の思想家。のちに秦に仕えた。","note":"秦の統一とその政策に関与した。"},{"id":"cn_shouou","term":"商鞅","read":"しょうおう","region":"中国","mem":[{"r":"中国","s":"春秋戦国"}],"type":"人物","group":"cn:人物","desc":"戦国時代に秦の政治改革（変法）を行った法家の人物。"},{"id":"cn_kanpishi","term":"韓非子","read":"かんぴし","region":"中国","mem":[{"r":"中国","s":"春秋戦国"}],"type":"人物","group":"cn:人物","desc":"法家の思想を大成した人物。","note":"人物としては「韓非」、その思想をまとめた書物が『韓非子』。"},{"id":"cn_bokka","term":"墨家","read":"ぼっか","region":"中国","mem":[{"r":"中国","s":"春秋戦国"}],"type":"概念","group":"cn:学派","desc":"墨子を祖とする学派。血縁をこえた無差別の愛（兼愛）などを説いた。"},{"id":"cn_douka","term":"道家","read":"どうか","region":"中国","mem":[{"r":"中国","s":"春秋戦国"}],"type":"概念","group":"cn:学派","desc":"老子・荘子を中心とする学派。無為自然を理想とした。"},{"id":"cn_roushi","term":"老子","read":"ろうし","region":"中国","mem":[{"r":"中国","s":"春秋戦国"}],"type":"人物","group":"cn:人物","desc":"道家の祖とされる人物。無為自然を理想とした。"},{"id":"cn_muishizen","term":"無為自然","read":"むいしぜん","region":"中国","mem":[{"r":"中国","s":"春秋戦国"}],"type":"概念","group":"cn:思想","desc":"人為を退け、あるがままの自然に従うべきとする道家の理想。"},{"id":"cn_soushi","term":"荘子","read":"そうし","region":"中国","mem":[{"r":"中国","s":"春秋戦国"}],"type":"人物","group":"cn:人物","desc":"戦国時代の道家の思想家。"},{"id":"cn_kourou","term":"黄老","read":"こうろう","region":"中国","mem":[{"r":"中国","s":"春秋戦国"}],"type":"概念","group":"cn:思想","desc":"老子・荘子の道家の教えを指す呼称。","note":"政治思想として重んじられたのは前漢の初め。資料では春秋戦国の文化として登場するため、ここでは春秋戦国に分類。"},{"id":"cn_tochujo","term":"董仲舒","read":"とうちゅうじょ","region":"中国","mem":[{"r":"中国","s":"漢"}],"type":"人物","group":"cn:人物","desc":"前漢・武帝期の儒家。儒学の影響力を高め、五経博士の設置など儒学の官学化を進めた。","note":"時代区分上は前漢。"},{"id":"cn_shibasen","term":"司馬遷","read":"しばせん","region":"中国","mem":[{"r":"中国","s":"漢"}],"type":"人物","group":"cn:人物","desc":"前漢・武帝期の歴史家。宮刑を受けながら歴史書『史記』を完成させた。","note":"時代区分上は前漢。","work":"cn_shiki"},{"id":"cn_shiki","term":"史記","read":"しき","region":"中国","mem":[{"r":"中国","s":"漢"}],"type":"書物","group":"cn:歴史書","desc":"司馬遷が著した歴史書。紀伝体で記され、中国の歴史書の基本的なかたちをつくった。","person":"cn_shibasen","cross":"歴史書"},{"id":"cn_hanko","term":"班固","read":"はんこ","region":"中国","mem":[{"r":"中国","s":"漢"}],"type":"人物","group":"cn:人物","desc":"後漢の歴史家。","note":"歴史書『漢書』を著した（漢書は単語リスト外）。時代区分上は後漢。"},{"id":"cn_jugaku","term":"儒学","read":"じゅがく","region":"中国","mem":[{"r":"中国","s":"漢"}],"type":"概念","group":"cn:儒学","desc":"孔子に始まる学問・思想。漢代に官学化され、国家の学問としての地位を確立した。"},{"id":"cn_kunko","term":"訓詁学","read":"くんこがく","region":"中国","mem":[{"r":"中国","s":"漢"}],"type":"概念","group":"cn:儒学","desc":"経典の字句の解釈を行う学問。後漢に発達し、鄭玄らが大成した。","note":"時代区分上は後漢。"},{"id":"cn_kidentai","term":"紀伝体","read":"きでんたい","region":"中国","mem":[{"r":"中国","s":"漢"}],"type":"概念","group":"cn:史叙述","desc":"本紀（皇帝の記録）と列伝（人物の伝記）を組み合わせて歴史を叙述する形式。『史記』が最初。"},{"id":"cn_chouken","term":"張騫","read":"ちょうけん","region":"中国","mem":[{"r":"中国","s":"漢"}],"type":"人物","group":"cn:人物","desc":"前漢・武帝期に大月氏へ派遣され、西域の事情を中国に伝えた人物。","note":"時代区分上は前漢。"},{"id":"cn_hanchou","term":"班超","read":"はんちょう","region":"中国","mem":[{"r":"中国","s":"漢"}],"type":"人物","group":"cn:人物","desc":"後漢の人物。西域に派遣され、西域都護となった。","note":"時代区分上は後漢。"},{"id":"cn_sairin","term":"蔡倫","read":"さいりん","region":"中国","mem":[{"r":"中国","s":"漢"}],"type":"人物","group":"cn:人物","desc":"後漢の人物。製紙法を改良した。","note":"時代区分上は後漢。"},{"id":"cn_monzen","term":"文選","read":"もんぜん","region":"中国","mem":[{"r":"中国","s":"南北朝"}],"type":"書物","group":"cn:文学作品","desc":"南朝の梁で編まれた、古今の名文・詩文を集めた詞華集（アンソロジー）。","note":"編者は昭明太子（資料では細字での登場）。","cross":"物語・文学作品"},{"id":"cn_touenmei","term":"陶淵明","read":"とうえんめい","region":"中国","mem":[{"r":"中国","s":"南北朝"}],"type":"人物","group":"cn:人物","desc":"東晋〜宋の詩人。田園詩で知られる。","note":"別名は陶潜（とうせん）。同一人物。"},{"id":"cn_kogaishi","term":"顧愷之","read":"こがいし","region":"中国","mem":[{"r":"中国","s":"南北朝"}],"type":"人物","group":"cn:人物","desc":"東晋の画家。『女史箴図』の作者とされる。","work":"cn_joshi"},{"id":"cn_joshi","term":"女史箴図","read":"じょしのしんず","region":"中国","mem":[{"r":"中国","s":"南北朝"}],"type":"書物","group":"cn:絵画","desc":"宮廷の女官が守るべき教えを説いた文章に、絵を付したもの。","person":"cn_kogaishi"},{"id":"cn_ougishi","term":"王羲之","read":"おうぎし","region":"中国","mem":[{"r":"中国","s":"南北朝"}],"type":"人物","group":"cn:人物","desc":"東晋の書家で「書聖」と称される。行書・草書を得意とし、後世の書道に大きな影響を残した。","work":"cn_rantei"},{"id":"cn_rantei","term":"蘭 "韓愈","read":"かんゆ","region":"中国","mem":[{"r":"中国","s":"唐"}],"type":"人物","group":"cn:人物","desc":"中唐の文人。柳宗元とともに古文復興を唱えた。","note":"時代区分上は中唐。"},{"id":"cn_ryusogen","term":"柳宗元","read":"りゅうそうげん","region":"中国","mem":[{"r":"中国","s":"唐"}],"type":"人物","group":"cn:人物","desc":"中唐の文人。韓愈とともに古文復興を唱えた。","note":"時代区分上は中唐。"},{"id":"cn_godogen","term":"呉道玄","read":"ごどうげん","region":"中国","mem":[{"r":"中国","s":"唐"}],"type":"人物","group":"cn:人物","desc":"唐の画家。「画聖」と称される。"},{"id":"cn_genjo","term":"玄奘","read":"げんじょう","region":"中国","mem":[{"r":"中国","s":"唐"}],"type":"人物","group":"cn:人物","desc":"唐の僧。陸路でインドへ赴いて仏典をもち帰り、漢訳に努めた。","note":"旅行記『大唐西域記』を著した（単語リスト外）。"},{"id":"cn_gijo","term":"義浄","read":"ぎじょう","region":"中国","mem":[{"r":"中国","s":"唐"}],"type":"人物","group":"cn:人物","desc":"唐の僧。海路でインドを訪れ、仏典をもち帰った。","note":"『南海寄帰内法伝』を著した（単語リスト外）。"},{"id":"cn_shutoni","term":"周敦頤","read":"しゅうとんい","region":"中国","mem":[{"r":"中国","s":"宋"}],"type":"人物","group":"cn:人物","desc":"北宋の儒学者。宇宙論と儒学の教えを結びつけ、宋学の祖と仰がれた。","work":"cn_taikyoku"},{"id":"cn_shuki","term":"朱熹","read":"しゅき","region":"中国","mem":[{"r":"中国","s":"宋"}],"type":"人物","group":"cn:人物","desc":"南宋の儒学者。宋学を大成した（朱子学）。のちに朝鮮や日本にも影響を与えた。","note":"朱子とも呼ばれる。"},{"id":"cn_oyoshu","term":"欧陽脩","read":"おうようしゅう","region":"中国","mem":[{"r":"中国","s":"宋"}],"type":"人物","group":"cn:人物","desc":"北宋の文人・歴史家。","note":"『新唐書』『新五代史』を撰した（単語リスト外）。"},{"id":"cn_soshoku","term":"蘇軾","read":"そしょく","region":"中国","mem":[{"r":"中国","s":"宋"}],"type":"人物","group":"cn:人物","desc":"北宋の文人。詩文・書画に優れた。","note":"『赤壁賦』『墨竹図』などで知られる（単語リスト外）。"},{"id":"cn_hakuji","term":"白磁","read":"はくじ","region":"中国","mem":[{"r":"中国","s":"宋"}],"type":"文物","group":"cn:陶磁","desc":"白色の下地の簡素な磁器。宋代を代表する陶磁器。"},{"id":"cn_seiji","term":"青磁","read":"せいじ","region":"中国","mem":[{"r":"中国","s":"宋"}],"type":"文物","group":"cn:陶磁","desc":"青みのある釉をかけた磁器。宋代を代表する陶磁器。"},{"id":"cn_bunjinga","term":"文人画","read":"ぶんじんが","region":"中国","mem":[{"r":"中国","s":"宋"}],"type":"文物","group":"cn:絵画","desc":"士大夫が描いた、精神性・内面性を表す絵画（南宗画）。"},{"id":"cn_intaiga","term":"院体画","read":"いんたいが","region":"中国","mem":[{"r":"中国","s":"宋"}],"type":"文物","group":"cn:絵画","desc":"宮廷画家による写実的な絵画（北宗画）。","note":"徽宗が代表的な担い手。"},{"id":"cn_sougaku","term":"宋学","read":"そうがく","region":"中国","mem":[{"r":"中国","s":"宋"}],"type":"概念","group":"cn:儒学","desc":"経典を哲学的に読み込み、宇宙万物の理に至ろうとする宋代の儒学。"},{"id":"cn_sandai","term":"三大発明","read":"さんだいはつめい","region":"中国","mem":[{"r":"中国","s":"宋"}],"type":"概念","group":"cn:技術","desc":"宋代に実用化・普及が進んだ火薬・羅針盤・木版印刷（活版印刷）を指す。","cross":"技術"},{"id":"cn_keitokuchin","term":"景徳鎮","read":"けいとくちん","region":"中国","mem":[{"r":"中国","s":"宋"},{"r":"中国","s":"明"}],"type":"文物","group":"cn:陶磁","desc":"江西省にある陶磁器の産地。","note":"宋代に分業生産で発展し、明代も主要な産地として栄えた。時代問題では宋・明いずれも正解。"},{"id":"cn_shijitsugan","term":"資治通鑑","read":"しじつがん","region":"中国","mem":[{"r":"中国","s":"宋"}],"type":"書物","group":"cn:歴史書","desc":"君臣関係を重視する立場で記された編年体の歴史書。","note":"北宋の司馬光が編纂した（司馬光は単語リスト外）。","cross":"歴史書"},{"id":"cn_shisho","term":"四書","read":"ししょ","region":"中国","mem":[{"r":"中国","s":"宋"}],"type":"概念","group":"cn:経典","desc":"宋学で特に重んじられた四つの経典。『論語』『大学』『中庸』『孟子』を指す。"},{"id":"cn_mokuhan","term":"木版印刷","read":"もくはんいんさつ","region":"中国","mem":[{"r":"中国","s":"宋"}],"type":"文物","group":"cn:技術","desc":"板木に文字を彫って刷る印刷技術。唐代に始まり、宋代に広まった。","cross":"技術"},{"id":"x_rashinban","term":"羅針盤","read":"らしんばん","region":"中国","mem":[{"r":"中国","s":"宋"},{"r":"ルネサンス","s":"科学・技術"}],"type":"文物","group":"cn:技術","desc":"方位を示す器具。宋代に実用化され、のちヨーロッパに伝わった。","cross":"技術","note":"ルネサンス文化史の教材では、中国から伝わり、天体観測に頼っていた航海術を大きくかえ、ヨーロッパ人の海洋進出を可能とした器具として登場する。文化圏の問題では中国・ルネサンスのいずれも正解とする。"},{"id":"cn_kayaku","term":"火薬","read":"かやく","region":"中国","mem":[{"r":"中国","s":"宋"}],"type":"文物","group":"cn:技術","desc":"宋代に実用化され、のちヨーロッパに伝わった。","cross":"技術"},{"id":"cn_taikyoku","term":"太極図説","read":"たいきょくずせつ","region":"中国","mem":[{"r":"中国","s":"宋"}],"type":"書物","group":"cn:思想書","desc":"宇宙論と儒学の教えを結びつけた書。宋学の基本概念となった。","person":"cn_shutoni"},{"id":"cn_touji","term":"陶磁器","read":"とうじき","region":"中国","mem":[{"r":"中国","s":"明"}],"type":"文物","group":"cn:陶磁","desc":"明代に生産が拡大した焼き物。景徳鎮などで作られ、ヨーロッパなどへ輸出された。"},{"id":"cn_sangokushi","term":"三国志演義","read":"さんごくしえんぎ","region":"中国","mem":[{"r":"中国","s":"明"}],"type":"書物","group":"cn:小説","desc":"明代に普及した長編の口語小説。","note":"作者は羅貫中とされる（単語リスト外）。","cross":"物語・文学作品"},{"id":"cn_saiyuki","term":"西遊記","read":"さいゆうき","region":"中国","mem":[{"r":"中国","s":"明"}],"type":"書物","group":"cn:小説","desc":"明代に普及した長編の口語小説。玄奘のインド旅行を題材とする。","note":"呉承恩の作とされる（単語リスト外）。","cross":"物語・文学作品"},{"id":"cn_suikoden","term":"水滸伝","read":"すいこでん","region":"中国","mem":[{"r":"中国","s":"明"}],"type":"書物","group":"cn:小説","desc":"明代に普及した長編の口語小説。","note":"施耐庵らの作とされる（単語リスト外）。","cross":"物語・文学作品"},{"id":"cn_shosetsu","term":"小説","read":"しょうせつ","region":"中国","mem":[{"r":"中国","s":"明"}],"type":"概念","group":"cn:小説","desc":"明代に三国志演義・西遊記・水滸伝などの口語小説が普及した。","note":"宋代の都市文化にも物語（小説）が登場するが、ここでは明に分類。"},{"id":"cn_oyomei","term":"王陽明","read":"おうようめい","region":"中国","mem":[{"r":"中国","s":"明"}],"type":"人物","group":"cn:人物","desc":"明代の儒学者。人は本来その心のうちに道徳をもつと説いた（陽明学）。","note":"人物名は王守仁、陽明は号。"},{"id":"cn_yomeigaku","term":"陽明学","read":"ようめいがく","region":"中国","mem":[{"r":"中国","s":"明"}],"type":"概念","group":"cn:儒学","desc":"王陽明がおこした儒学の一派。庶民のあいだにも広い支持を得た。"},{"id":"cn_kagakusho","term":"科学技術書","read":"かがくぎじゅつしょ","region":"中国","mem":[{"r":"中国","s":"明"}],"type":"概念","group":"cn:科学書","desc":"明末に関心が高まり、『本草綱目』『農政全書』『天工開物』などが著された。"},{"id":"cn_tokisho","term":"董其昌","read":"とうきしょう","region":"中国","mem":[{"r":"中国","s":"明"}],"type":"人物","group":"cn:人物","desc":"明代の画家。文人画を受け継ぐ画風で知られる。"},{"id":"cn_honzo","term":"本草綱目","read":"ほんぞうこうもく","region":"中国","mem":[{"r":"中国","s":"明"}],"type":"書物","group":"cn:科学書","desc":"明代に著された薬物学の書物。","note":"李時珍の著（単語リスト外）。"},{"id":"cn_konyo","term":"坤輿万国全図","read":"こんよばんこくぜんず","region":"中国","mem":[{"r":"中国","s":"明"}],"type":"書物","group":"cn:地図","desc":"中国に新しい地理知識を広めた世界地図。","note":"マテオ=リッチが作製した。","person":"cn_matteo"},{"id":"cn_matteo","term":"マテオ=リッチ","read":"まてお=りっち","region":"中国","mem":[{"r":"中国","s":"明"}],"type":"人物","group":"cn:人物","desc":"明代に中国で布教したイエズス会の宣教師。","work":"cn_konyo"},{"id":"cn_zabieru","term":"ザビエル","read":"ざびえる","region":"中国","mem":[{"r":"中国","s":"明"}],"type":"人物","group":"cn:人物","desc":"イエズス会の宣教師。中国布教をめざしたが実現しなかった。"},{"id":"cn_jokokei","term":"徐光啓","read":"じょこうけい","region":"中国","mem":[{"r":"中国","s":"明"}],"type":"人物","group":"cn:人物","desc":"明代の学者。リッチに学び、西洋学術の導入に努めた。","note":"『農政全書』を編纂した（単語リスト外）。"},{"id":"cn_kokijiten","term":"康熙字典","read":"こうきじてん","region":"中国","mem":[{"r":"中国","s":"清"}],"type":"書物","group":"cn:編纂物","desc":"清代に編纂された漢字字典。","note":"皇帝の命による大規模な編纂事業。"},{"id":"cn_koenbu","term":"顧炎武","read":"こえんぶ","region":"中国","mem":[{"r":"中国","s":"清"}],"type":"人物","group":"cn:人物","desc":"清初の学者。事実にもとづく実証的な研究を主張し、考証学の先駆となった。"},{"id":"cn_benpatsu","term":"辮髪","read":"べんぱつ","region":"中国","mem":[{"r":"中国","s":"清"}],"type":"文物","group":"cn:風習","desc":"清が漢人男性に強制した、満洲人の髪型。"},{"id":"cn_shikozensho","term":"四庫全書","read":"しこぜんしょ","region":"中国","mem":[{"r":"中国","s":"清"}],"type":"書物","group":"cn:編纂物","desc":"清代の大規模な編纂事業によってまとめられた叢書。"},{"id":"cn_enmeien","term":"円明園","read":"えんめいえん","region":"中国","mem":[{"r":"中国","s":"清"}],"type":"文物","group":"cn:建築","desc":"北京郊外に建設された離宮。バロック様式の西洋建築を含む広大な庭園。","note":"第2次アヘン戦争の際に英仏軍によって破壊された。","cross":"建築"},{"id":"cn_koromu","term":"紅楼夢","read":"こうろうむ","region":"中国","mem":[{"r":"中国","s":"清"}],"type":"書物","group":"cn:小説","desc":"清代中期の長編小説。上流階級の生活を細やかに描く。","note":"曹雪芹の作（単語リスト外）。","cross":"物語・文学作品"},{"id":"cn_koshogaku","term":"考証学","read":"こうしょうがく","region":"中国","mem":[{"r":"中国","s":"清"}],"type":"概念","group":"cn:儒学","desc":"経典の校訂や言語学的研究を精密に行う学問。清代中期に発達した。"},{"id":"gr_homeros","term":"ホメロス","read":"ほめろす","region":"ギリシア・ローマ","mem":[{"r":"ギリシア・ローマ","s":"ギリシア"}],"type":"人物","group":"gr:文学","desc":"叙事詩『イリアス』『オデュッセイア』を残した。トロイア戦争を題材とする。"},{"id":"gr_hesiodos","term":"ヘシオドス","read":"へしおどす","region":"ギリシア・ローマ","mem":[{"r":"ギリシア・ローマ","s":"ギリシア"}],"type":"人物","group":"gr:文学","desc":"『神統記』（神々の系譜）、『労働と日々』（市民への教訓）を残した。"},{"id":"gr_sappho","term":"サッフォー","read":"さっふぉー","region":"ギリシア・ローマ","mem":[{"r":"ギリシア・ローマ","s":"ギリシア"}],"type":"人物","group":"gr:文学","desc":"レスボス島の女性詩人。情熱的な叙情詩を残した。"},{"id":"gr_aischylos","term":"アイスキュロス","read":"あいすきゅろす","region":"ギリシア・ローマ","mem":[{"r":"ギリシア・ローマ","s":"ギリシア"}],"type":"人物","group":"gr:文学","desc":"悲劇『アガメムノン』。雄大で格調高い作品で知られる。"},{"id":"gr_sophokles","term":"ソフォクレス","read":"そふぉくれす","region":"ギリシア・ローマ","mem":[{"r":"ギリシア・ローマ","s":"ギリシア"}],"type":"人物","group":"gr:文学","desc":"悲劇『オイディプス王』。高貴な人間像を描いた。"},{"id":"gr_euripides","term":"エウリピデス","read":"えうりぴです","region":"ギリシア・ローマ","mem":[{"r":"ギリシア・ローマ","s":"ギリシア"}],"type":"人物","group":"gr:文学","desc":"悲劇『メデイア』。人間の心理を深く描写した。"},{"id":"gr_aristophanes","term":"アリストファネス","read":"ありすとふぁねす","region":"ギリシア・ローマ","mem":[{"r":"ギリシア・ローマ","s":"ギリシア"}],"type":"人物","group":"gr:文学","desc":"喜劇『女の平和』『女の議会』。社会世相やソフィストを風刺した。"},{"id":"gr_sophist","term":"ソフィスト","read":"そふぃすと","region":"ギリシア・ローマ","mem":[{"r":"ギリシア・ローマ","s":"ギリシア"}],"type":"概念","group":"gr:哲学・思想","desc":"弁論術を教えた職業教師。相手をいかに説得するかを教えた。","note":"代表的な人物がプロタゴラス。"},{"id":"gr_protagoras","term":"プロタゴラス","read":"ぷろたごらす","region":"ギリシア・ローマ","mem":[{"r":"ギリシア・ローマ","s":"ギリシア"}],"type":"人物","group":"gr:哲学・思想","desc":"ソフィスト。「万物の尺度は人間」と説き、真理の主観性を主張した。"},{"id":"gr_sokrates","term":"ソクラテス","read":"そくらてす","region":"ギリシア・ローマ","mem":[{"r":"ギリシア・ローマ","s":"ギリシア"}],"type":"人物","group":"gr:哲学・思想","desc":"「汝自身を知れ」。問答を通じて真理の客観性を説いた西洋哲学の祖。"},{"id":"gr_platon","term":"プラトン","read":"ぷらとん","region":"ギリシア・ローマ","mem":[{"r":"ギリシア・ローマ","s":"ギリシア"}],"type":"人物","group":"gr:哲学・思想","desc":"イデア論を説き、哲人による理想政治を主張。『国家』、アカデメイアを開設した。"},{"id":"gr_thales","term":"タレス","read":"たれす","region":"ギリシア・ローマ","mem":[{"r":"ギリシア・ローマ","s":"ギリシア"}],"type":"人物","group":"gr:自然科学","desc":"万物の根源を水と考えた、イオニア自然哲学の祖。"},{"id":"gr_pythagoras","term":"ピタゴラス","read":"ぴたごらす","region":"ギリシア・ローマ","mem":[{"r":"ギリシア・ローマ","s":"ギリシア"}],"type":"人物","group":"gr:自然科学","desc":"万物の根源を数とし、「ピタゴラスの定理」で知られる。"},{"id":"gr_herakleitos","term":"ヘラクレイトス","read":"へらくれいとす","region":"ギリシア・ローマ","mem":[{"r":"ギリシア・ローマ","s":"ギリシア"}],"type":"人物","group":"gr:自然科学","desc":"万物の根源を火とし、「万物は流転する」と説いた。"},{"id":"gr_demokritos","term":"デモクリトス","read":"でもくりとす","region":"ギリシア・ローマ","mem":[{"r":"ギリシア・ローマ","s":"ギリシア"}],"type":"人物","group":"gr:自然科学","desc":"万物の根源を原子（アトム）とする原子論・唯物論の祖。"},{"id":"gr_hippokrates","term":"ヒッポクラテス","read":"ひっぽくらてす","region":"ギリシア・ローマ","mem":[{"r":"ギリシア・ローマ","s":"ギリシア"}],"type":"人物","group":"gr:自然科学","desc":"臨床を重視した「西洋医学の父」。"},{"id":"gr_pheidias","term":"フェイディアス","read":"ふぇいでぃあす","region":"ギリシア・ローマ","mem":[{"r":"ギリシア・ローマ","s":"ギリシア"}],"type":"人物","group":"gr:彫刻美術","desc":"パルテノン神殿のアテナ女神像を制作し、神殿彫刻を監督した。"},{"id":"gr_praxiteles","term":"プラクシテレス","read":"ぷらくしてれす","region":"ギリシア・ローマ","mem":[{"r":"ギリシア・ローマ","s":"ギリシア"}],"type":"人物","group":"gr:彫刻美術","desc":"「ヘルメス神像」。若い神を好んで彫像化した。"},{"id":"gr_herodotos","term":"ヘロドトス","read":"へろどとす","region":"ギリシア・ローマ","mem":[{"r":"ギリシア・ローマ","s":"ギリシア"}],"type":"人物","group":"gr:歴史","desc":"『歴史』。ペルシア戦争を物語的に記述した。"},{"id":"gr_thukydides","term":"トゥキディデス","read":"とぅきでぃです","region":"ギリシア・ローマ","mem":[{"r":"ギリシア・ローマ","s":"ギリシア"}],"type":"人物","group":"gr:歴史","desc":"『歴史（戦史）』。ペロポネソス戦争を客観的に記述した。"},{"id":"gr_parthenon","term":"パルテノン神殿","read":"ぱるてのんしんでん","region":"ギリシア・ローマ","mem":[{"r":"ギリシア・ローマ","s":"ギリシア"}],"type":"概念","group":"gr:建築","desc":"アテネのアクロポリスに立つドーリア式神殿の傑作。アテネ民主政の最盛期を象徴する。","cross":"建築"},{"id":"gr_epikuros","term":"エピクロス","read":"えぴくろす","region":"ギリシア・ローマ","mem":[{"r":"ギリシア・ローマ","s":"ヘレニズム"}],"type":"人物","group":"gr:哲学・思想","desc":"精神的快楽（心の平安）を人生の目的とする、エピクロス派の祖。"},{"id":"gr_zenon","term":"ゼノン","read":"ぜのん","region":"ギリシア・ローマ","mem":[{"r":"ギリシア・ローマ","s":"ヘレニズム"}],"type":"人物","group":"gr:哲学・思想","desc":"禁欲を重んじて理性的境地を求める、ストア派の祖。"},{"id":"gr_epikuros_ha","term":"エピクロス派","read":"えぴくろすは","region":"ギリシア・ローマ","mem":[{"r":"ギリシア・ローマ","s":"ヘレニズム"}],"type":"概念","group":"gr:哲学・思想","desc":"精神的快楽（アタラクシア）を人生の目的とする学派。","person":"gr_epikuros"},{"id":"gr_stoa_ha","term":"ストア派","read":"すとあは","region":"ギリシア・ローマ","mem":[{"r":"ギリシア・ローマ","s":"ヘレニズム"}],"type":"概念","group":"gr:哲学・思想","desc":"禁欲による理性的境地（アパティア）を うのれきし","region":"イスラーム","mem":[{"r":"イスラーム","s":"学問"}],"type":"作品","group":"is:著作","desc":"タバリーが編纂した年代記。","person":"is_tabari","cross":"歴史書"},{"id":"is_senya","term":"千夜一夜物語(アラビアン=ナイト)","read":"せんやいちやものがたり","region":"イスラーム","mem":[{"r":"イスラーム","s":"文芸・美術"}],"type":"作品","group":"is:著作","desc":"インド・イラン・アラビア・ギリシアなどの説話を集成した物語。","cross":"物語・文学作品"},{"id":"is_arabesque","term":"アラベスク","read":"あらべすく","region":"イスラーム","mem":[{"r":"イスラーム","s":"文芸・美術"}],"type":"概念","group":"is:美術","desc":"植物や文字を文様化した精緻な装飾文様。偶像を禁じたことから発達した。"},{"id":"is_seishi","term":"製紙法","read":"せいしほう","region":"イスラーム","mem":[{"r":"イスラーム","s":"その他"},{"r":"中国","s":"漢"}],"type":"概念","group":"is:技術","desc":"中国から伝わった紙の製法。アッバース朝期の文化を支えた。","note":"製紙法そのものは後漢の蔡倫が改良した中国の技術。文化圏の問題では中国・イスラームのいずれも正解とする。","cross":"技術"},{"id":"is_islam_culture","term":"イスラーム文化","read":"いすらーむぶんか","region":"イスラーム","mem":[{"r":"イスラーム","s":"その他"}],"type":"概念","group":"is:総称","desc":"西アジアと周辺地域の文化、イスラーム教、アラビア語が融合して生まれた文化。","cross":"文化総称"},{"id":"me_shudoin","term":"修道院","read":"しゅうどういん","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"修道院"}],"type":"概念","group":"me:修道院","desc":"世俗を離れた修行の場。中世西ヨーロッパで大きな文化的役割を果たした。"},{"id":"me_undou","term":"修道院運動","read":"しゅうどういんうんどう","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"修道院"}],"type":"概念","group":"me:修道院","desc":"6世紀にベネディクトゥスがイタリアのモンテ=カシノに修道会を開いたことに始まる、修道生活の刷新と拡大の動き。","note":"起点となったのはベネディクト修道会。「祈り、働け」のモットーは、生産労働を奴隷の仕事とみる古典古代以来の労働観を大きくかえた。"},{"id":"me_citeaux","term":"シトー修道会","read":"しとーしゅうどうかい","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"修道院"}],"type":"概念","group":"me:修道院","desc":"12〜13世紀の大開墾時代に、森林を切りひらく開墾の先頭に立った修道会。"},{"id":"me_daikaikon","term":"大開墾時代","read":"だいかいこんじだい","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"修道院"}],"type":"概念","group":"me:出来事","desc":"12〜13世紀、森林を切りひらいて耕地を広げた時代。シトー修道会をはじめとする修道院がその先頭に立った。"},{"id":"me_shingaku","term":"神学","read":"しんがく","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"学問・思想"}],"type":"概念","group":"me:学問概念","desc":"中世西ヨーロッパで最高の学問とされたもの。哲学や自然科学はその下に置かれた。"},{"id":"me_schola","term":"スコラ学","read":"すこらがく","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"学問・思想"}],"type":"概念","group":"me:学問概念","desc":"教会の権威の理論的確立のため、信仰を論理的に体系化しようとした中世西ヨーロッパ特有の学問。アリストテレス哲学の影響を受けて壮大な体系となった。"},{"id":"me_fuhen","term":"普遍論争","read":"ふへんろんそう","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"学問・思想"}],"type":"概念","group":"me:学問概念","desc":"「普遍」が現実に実体として存在するか、思考のなかに存在するにすぎないかをめぐる、スコラ学の中心的議論。","note":"実在論と唯名論が対立した。"},{"id":"me_jitsuzai","term":"実在論","read":"じつざいろん","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"学問・思想"}],"type":"概念","group":"me:学問概念","desc":"普遍論争において、普遍は現実に実体として存在すると主張した立場。","note":"アンセルムスが代表。13世紀のトマス=アクィナスもこの立場。","pair":"me_yuimei"},{"id":"me_yuimei","term":"唯名論","read":"ゆいめいろん","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"学問・思想"}],"type":"概念","group":"me:学問概念","desc":"普遍論争において、普遍は名称にすぎず、実在するのは個物だけであるとした立場。","note":"アベラールやウィリアム=オブ=オッカムが代表。","pair":"me_jitsuzai"},{"id":"me_anselmus","term":"アンセルムス","read":"あんせるむす","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"学問・思想"}],"type":"人物","group":"me:人物","desc":"11世紀後半から12世紀初めに活躍し、普遍論争で実在論の議論を代表した人物。","stance":"実在論"},{"id":"me_abelard","term":"アベラール","read":"あべらーる","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"学問・思想"}],"type":"人物","group":"me:人物","desc":"12世紀前半に活躍し、普遍論争で唯名論の立場に立った人物。","stance":"唯名論"},{"id":"me_thomas","term":"トマス=アクィナス","read":"とます=あくぃなす","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"学問・思想"}],"type":"人物","group":"me:人物","desc":"13世紀にスコラ学を大成し、その学問は教皇権の理論的支柱となった。","note":"南イタリアの貴族出身でドミニコ派に属し、パリ・ローマ・ナポリなどの大学で教授をつとめた。普遍論争では実在論の立場。","stance":"実在論","work":"me_shingakutaizen"},{"id":"me_occam","term":"ウィリアム=オブ=オッカム","read":"うぃりあむ=おぶ=おっかむ","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"学問・思想"}],"type":"人物","group":"me:人物","desc":"14世紀に唯名論の立場に立ち、近代合理思想の基礎を築いた人物。","stance":"唯名論"},{"id":"me_rbacon","term":"ロジャー=ベーコン","read":"ろじゃー=べーこん","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"学問・思想"}],"type":"人物","group":"me:人物","desc":"実験と数学を科学の手法として重視し、のちの近代科学を準備した13世紀の人物。","note":"イングランド出身のフランチェスコ会士。","stance":"自然科学"},{"id":"me_shingakutaizen","term":"『神学大全』","read":"しんがくたいぜん","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"学問・思想"}],"type":"書物","group":"me:神学書","desc":"トマス=アクィナスが著した、スコラ学の集大成となる書物。","note":"トマスは『哲学大全』も著しているため、誤答には用いていない。","person":"me_thomas"},{"id":"me_runesansu","term":"12世紀ルネサンス","read":"じゅうにせいきるねさんす","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"学問・思想"}],"type":"概念","group":"me:学問概念","desc":"ビザンツ帝国やイスラーム圏からもたらされたギリシアの古典が、ギリシア語やアラビア語から本格的にラテン語に翻訳され、学問や文芸が大きく発展した動き。","note":"翻訳活動の中心はイベリア半島のトレドやシチリア島のパレルモ。"},{"id":"me_shichika","term":"自由七科","read":"じゆうしちか","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"学問・思想"}],"type":"概念","group":"me:学問概念","desc":"大学で教育された基礎的な教養科目。三学（文法・修辞・論理）と四科（算術・幾何・天文・音楽）からなる。"},{"id":"me_bologna","term":"ボローニャ大学","read":"ぼろーにゃだいがく","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"大学"}],"type":"大学","group":"me:大学","desc":"イタリアにある、最古の大学といわれる大学。11世紀にローマ法・教会法の法学校から発展し、法学で有名。","note":"学生が自治団体としての学生組合を形成したことに始まり、ローマ法学の復興に貢献した。","faculty":"法学","country":"イタリア","cross":"学問機関"},{"id":"me_paris","term":"パリ大学","read":"ぱりだいがく","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"大学"}],"type":"大学","group":"me:大学","desc":"フランスにある、神学で有名な大学。12世紀に司教座付属学校の教師・学生の自治団体から発展した。","note":"在籍した人物にトマス=アクィナス。","faculty":"神学","country":"フランス","cross":"学問機関"},{"id":"me_salerno","term":"サレルノ大学","read":"されるのだいがく","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"大学"}],"type":"大学","group":"me:大学","desc":"イタリアにある、医学を中心とする大学。古くから存在していた医学校から発展し、イスラーム医学を導入した。","faculty":"医学","country":"イタリア","cross":"学問機関"},{"id":"me_oxford","term":"オクスフォード大学","read":"おくすふぉーどだいがく","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"大学"}],"type":"大学","group":"me:大学","desc":"イギリスにある、神学を中心とする大学。12世紀、パリ大学を模範として創設された。","note":"資料集ではパリ大学からの学生により形成・発展と記載。在籍した人物にロジャー=ベーコン、ウィリアム=オブ=オッカム、ウィクリフ。","faculty":"神学","country":"イギリス","cross":"学問機関"},{"id":"me_cambridge","term":"ケンブリッジ大学","read":"けんぶりっじだいがく","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"大学"}],"type":"大学","group":"me:大学","desc":"イギリスにある大学。13世紀にオクスフォード大学から分かれてでき、独自の学寮（コレッジ）制をもとに発展した。","note":"教科書の一覧表では神学。資料集では17世紀以降、自然科学研究の中心となったと記載（ニュートン・ダーウィンが在籍）。","faculty":"神学","country":"イギリス","cross":"学問機関"},{"id":"me_romanesque","term":"ロマネスク様式","read":"ろまねすくようしき","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"建築"}],"type":"様式","group":"me:様式","desc":"11世紀に生み出された教会建築様式。厚い石壁と列柱、小さい窓をもつ重厚なつくりが特徴。","note":"南欧中心に発達。代表例にピサ大聖堂・シュパイアー大聖堂・クリュニー修道院。","pair":"me_gothic","cross":"様式"},{"id":"me_gothic","term":"ゴシック様式","read":"ごしっくようしき","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"建築"}],"type":"様式","group":"me:様式","desc":"12世紀に現れた教会建築様式。頭部のとがった尖頭アーチと高くそびえる塔を特徴とし、広い窓はステンドグラスで飾られた。","note":"北フランスにおこり、西欧・北欧中心に普及。繁栄する商人の経済力を背景に各都市に建設された。","pair":"me_romanesque","cross":"様式"},{"id":"me_pisa","term":"ピサ大聖堂","read":"ぴさだいせいどう","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"建築"}],"type":"建築物","group":"me:大聖堂","desc":"イタリアにあるロマネスク様式の大聖堂。11〜12世紀に建てられ、アーケードと列柱による外観が特徴。","note":"アーケードと列柱によるその様式は「ピサ式ロマネスク」と呼ばれる。","country":"イタリア","style":"ロマネスク様式"},{"id":"me_speyer","term":"シュパイアー大聖堂","read":"しゅぱいあーだいせいどう","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"建築"}],"type":"建築物","group":"me:大聖堂","desc":"ドイツ中南部にあるロマネスク様式の大聖堂。12世紀半ばに完成した、この様式の代表例。","country":"ドイツ","style":"ロマネスク様式"},{"id":"me_notredame","term":"ノートルダム大聖堂","read":"のーとるだむだいせいどう","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"建築"}],"type":"建築物","group":"me:大聖堂","desc":"フランスのパリにあるゴシック様式の大聖堂。バラ窓のステンドグラスで知られる。","country":"フランス","style":"ゴシック様式"},{"id":"me_chartres","term":"シャルトル大聖堂","read":"しゃるとるだいせいどう","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"建築"}],"type":"建築物","group":"me:大聖堂","desc":"フランス、パリの南西にあるゴシック様式の大聖堂。とくに美しく保存のよいステンドグラスをもち、その青は「シャルトルブルー」と呼ばれる。","country":"フランス","style":"ゴシック様式"},{"id":"me_reims","term":"ランス大聖堂","read":"らんすだいせいどう","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"建築"}],"type":"建築物","group":"me:大聖堂","desc":"フランス北東部にあるゴシック様式の大聖堂。歴代フランス王の戴冠式がおこなわれた。","country":"フランス","style":"ゴシック様式"},{"id":"me_koln","term":"ケルン大聖堂","read":"けるんだいせいどう","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"建築"}],"type":"建築物","group":"me:大聖堂","desc":"ドイツにあるゴシック様式の大聖堂。尖頭アーチと高い塔をもつこの様式の代表例の一つ。","country":"ドイツ","style":"ゴシック様式"},{"id":"me_glass","term":"ステンドグラス","read":"すてんどぐらす","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"建築"}],"type":"文物","group":"me:建築要素","desc":"壁を薄くする技術の進歩で広くなった窓にはめられた、色彩豊かな彩色ガラス絵。","note":"ゴシック様式の教会堂の特色。ノートルダム大聖堂のバラ窓、シャルトル大聖堂のものが有名。"},{"id":"me_kishido","term":"騎士道物語","read":"きしどうものがたり","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"文学"}],"type":"概念","group":"me:文学概念","desc":"ラテン語ではなく口語（俗語）で表現された中世文学の代表。騎士の武勲や恋愛をテーマとした。","note":"騎士道＝武勇と主君への忠誠、神への信仰、女性・弱者の保護などを重視する騎士の道徳。"},{"id":"me_roland","term":"『ローランの歌』","read":"ろーらんのうた","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"文学"}],"type":"書物","group":"me:文学作品","desc":"カール大帝時代の騎士の武勲を題材とした騎士道物語。","theme":"カール大帝時代の騎士の武勲が題材","cross":"物語・文学作品"},{"id":"me_nibelungen","term":"『ニーベルンゲンの歌』","read":"にーべるんげんのうた","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"文学"}],"type":"書物","group":"me:文学作品","desc":"ゲルマンの英雄叙事詩として知られる中世文学。","note":"資料集では、中世ドイツの英雄叙事詩で13世紀初めに成立と記載。","theme":"ゲルマンの英雄叙事詩","cross":"物語・文学作品"},{"id":"me_arthur","term":"『アーサー王物語』","read":"あーさーおうものがたり","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"文学"}],"type":"書物","group":"me:文学作品","desc":"イギリスのケルト人の伝説から発展した騎士道物語。","note":"挿絵で活躍が描かれる騎士にランスロット。","theme":"イギリスのケルト人の伝説から発展","cross":"物語・文学作品"},{"id":"me_ginyuu","term":"吟遊詩人","read":"ぎんゆうしじん","region":"中世ヨーロッパ","mem":[{"r":"中世ヨーロッパ","s":"文学"}],"type":"概念","group":"me:文学概念","desc":"おもに宮廷において、騎士の恋愛を叙情詩にうたった人々。その最盛期は12世紀であった。","note":"フランスでトゥルバドゥール、ドイツでミンネジンガーと呼ばれた。"},{"id":"x_aristoteles","term":"アリストテレス","read":"ありすとてれす","region":"ギリシア・ローマ","mem":[{"r":"ギリシア・ローマ","s":"ギリシア"},{"r":"イスラーム","s":"学問"}],"type":"人物","group":"gr:哲学・思想","desc":"諸学問を体系化した「万学の祖」。『政治学』。アレクサンドロスの師。","note":"イスラーム世界では著作がアラビア語に翻訳され、「第一の師」と呼ばれて尊敬された（イスラーム文化史の教材にも登場）。"},{"id":"x_latin","term":"ラテン語","read":"らてんご","region":"ギリシア・ローマ","mem":[{"r":"ギリシア・ローマ","s":"ローマ"},{"r":"中世ヨーロッパ","s":"学問・思想"},{"r":"ルネサンス","s":"文芸・思想"}],"type":"概念","group":"gr:言語","desc":"ローマ人の言語。中世西ヨーロッパでも、学者・知識人が用いる学問の国際的共通語であり続けた。","note":"ギリシア・ローマ文化史（ローマの言語）と中世ヨーロッパ文化史（学問の共通語）の両方の教材に登場する。ルネサンス文化史の教材でも、人文主義者が修道院に死蔵されていた文献を解読するのに用いた、信仰と学問の言語として登場する。元の説明：「ローマ人の言語。近代に至るまで教会や学術の国際的な公用語であった。」","cross":"言語・文字"},{"id":"rn_renaissance","term":"ルネサンス","read":"るねさんす","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"概説"}],"type":"概念","group":"rn:文化総称","desc":"14世紀にイタリア諸都市に始まり、16世紀までに西ヨーロッパ各地へ広まった、文芸・科学・芸術など多方面の文化活動の総称。「再生」を意味する。","note":"担い手はキリスト教を否定しなかったが、現世の文化を尊重した。多くが大富豪や国王・教皇などの保護下で活動したため、既存の社会体制を直接的に批判する運動とはならなかった。","cross":"文化総称"},{"id":"rn_pest","term":"黒死病（ペスト）","read":"こくしびょう","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"概説"}],"type":"概念","group":"rn:出来事","desc":"中世末期のヨーロッパで大流行し、多くの死者を出した疫病。生ける者としての人間に以前よりも大きな価値が見出される契機となった。"},{"id":"rn_humanism","term":"人文主義（ヒューマニズム）","read":"じんぶんしゅぎ","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"概説"}],"type":"概念","group":"rn:文化総称","desc":"人が価値あるものとして現世を生きるための指針を得るため、キリスト教以前のギリシア・ローマの文化を探究した、文芸や思想面での動き。","note":"中世の西ヨーロッパで忘れられていたギリシア語は、オスマン帝国の圧迫でビザンツ帝国から逃れた知識人によって伝えられた。","cross":"文化総称"},{"id":"rn_bannoujin","term":"万能人","read":"ばんのうじん","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"概説"}],"type":"概念","group":"rn:人間像","desc":"レオナルド=ダ=ヴィンチに象徴される、文芸や自然諸学に通じた人物像。ルネサンスの理想とされた。","note":"図説では、ミケランジェロも同じく「万能人」の典型とされる。"},{"id":"rn_firenze","term":"フィレンツェ","read":"ふぃれんつぇ","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"概説"}],"type":"概念","group":"rn:都市","desc":"ルネサンスが14世紀に始まったイタリアの都市。メディチ家が政治の実権を握った。","note":"図説では「花の都」の意と記載。ミケランジェロの「ダヴィデ像」は、この都市の市庁舎前におかれた。"},{"id":"rn_medici","term":"メディチ家","read":"めでぃちけ","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"概説"}],"type":"概念","group":"rn:家門","desc":"ルネサンスを推進した文化人を保護した、フィレンツェの大富豪。","note":"図説によれば、最初は薬種商を営み、15世紀には銀行家となった。コジモからロレンツォの時代にフィレンツェ共和国の政治実権を握り、ロレンツォの子ジョヴァンニは教皇レオ10世となった。"},{"id":"rn_ren_style","term":"ルネサンス様式","read":"るねさんすようしき","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"美術・建築"}],"type":"概念","group":"rn:様式・技法","desc":"古代建築の要素を取り入れ、均整と調和を重視した建築様式。","note":"この様式の成立とともに、建築はすべての学問を統合する最高の科学として称揚された。図説ではジョットがこの様式の祖とされる。","cross":"様式"},{"id":"rn_enkinho","term":"遠近法","read":"えんきんほう","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"美術・建築"}],"type":"概念","group":"rn:様式・技法","desc":"油絵の技法とともに絵画で確立され、近代絵画の基本である写実主義への道を開いた技法。","note":"図説では「最後の晩餐」の例が示され、中央のイエスの奥にすべての線が集中する構図と説明されている。"},{"id":"rn_senseijutsu","term":"占星術","read":"せんせいじゅつ","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"科学・技術"}],"type":"概念","group":"rn:学問","desc":"中世以来の学問の一つ。天文学の発達を導き、天体の動きが観測される契機となった。"},{"id":"rn_renkinjutsu","term":"錬金術","read":"れんきんじゅつ","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"科学・技術"}],"type":"概念","group":"rn:学問","desc":"中世以来の学問の一つ。金属技術の発達をもたらし、後世の化学の基礎ともなった。"},{"id":"rn_chikyu","term":"地球球体説","read":"ちきゅうきゅうたいせつ","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"科学・技術"}],"type":"概念","group":"rn:学説","desc":"天体の動きが観測された結果、トスカネリによってとなえられた説。"},{"id":"rn_chidosetsu","term":"地動説","read":"ちどうせつ","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"科学・技術"}],"type":"概念","group":"rn:学説","desc":"宇宙の中心は地球ではなく太陽であるとする説。コペルニクスがとなえ、人々の世界観に大きな影響を与えた。","note":"図説によれば、ジョルダーノ=ブルーノもこの説を支持し、ガリレイは『二大世界体系対話』で天動説と比較しながらこの説を論じた。"},{"id":"rn_kaki","term":"火器","read":"かき","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"科学・技術"}],"type":"概念","group":"rn:技術","desc":"中国から伝来し、ルネサンス期に改良された兵器。これにより鉄砲や大砲が発明された。","cross":"技術"},{"id":"rn_gunji","term":"軍事革命","read":"ぐんじかくめい","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"科学・技術"}],"type":"概念","group":"rn:出来事","desc":"鉄砲や大砲の発明が従来の戦術を一変させ、騎士の没落をもたらしたこと。"},{"id":"rn_kappan","term":"活版印刷術","read":"かっぱんいんさつじゅつ","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"科学・技術"}],"type":"概念","group":"rn:技術","desc":"グーテンベルクが改良した技術。紙の普及とあいまって大量の印刷物を可能にし、文芸の振興と、その後の宗教改革の一助ともなった。","note":"図説によれば、印刷本は手写本の約10分の1の価格になった。","cross":"技術"},{"id":"rn_dante","term":"ダンテ","read":"だんて","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"文芸・思想"}],"type":"人物","group":"rn:人物:文芸・思想","desc":"イタリアの詩人。ラテン語ではなく各国語で著されたその作品が、ルネサンス期の文芸の先駆となった。","note":"図説によれば『神曲』は、詩人ウェルギリウスの案内で地獄・煉獄へ、恋人ベアトリーチェに導かれて天国へと至る一大叙事詩。","country":"イタリア","field":"文芸・思想","works":[{"t":"『神曲』"}]},{"id":"rn_petrarca","term":"ペトラルカ","read":"ぺとらるか","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"文芸・思想"}],"type":"人物","group":"rn:人物:文芸・思想","desc":"イタリアの詩人・人文主義者。ギリシア語を学びつつラテン語の知識を用いて、古代の文献を解読した人文主義者の代表格。","note":"図説には、古代ローマの弁論家キケロの書簡集を発見した感想を、キケロ本人に宛てて書いた手紙が収められている。","country":"イタリア","field":"文芸・思想","works":[{"t":"『抒情詩集』"}]},{"id":"rn_boccaccio","term":"ボッカチオ","read":"ぼっかちお","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"文芸・思想"}],"type":"人物","group":"rn:人物:文芸・思想","desc":"イタリアの人文主義者。ペトラルカとならぶ人文主義者の代表とされる。","note":"図説によれば、その『デカメロン』はチョーサーの『カンタベリ物語』に影響を与えた。","country":"イタリア","field":"文芸・思想","works":[{"t":"『デカメロン』"}]},{"id":"rn_chaucer","term":"チョーサー","read":"ちょーさー","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"文芸・思想"}],"type":"人物","group":"rn:人物:文芸・思想","desc":"「英詩の父」と称されるイギリスの文人。巡礼者たちが旅の道すがら物語を語り合う作品を残した。","note":"図説によれば、14世紀イングランドのほぼすべての階層を代表する人々を、その典型としてリアルに、皮肉をきかせて描き出した。","country":"イギリス","field":"文芸・思想","works":[{"t":"『カンタベリ物語』"}]},{"id":"rn_erasmus","term":"エラスムス","read":"えらすむす","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"文芸・思想"}],"type":"人物","group":"rn:人物:文芸・思想","desc":"人文主義者を代表する人物。人間はおろかしくとも幸福に生きていけるとし、謹厳さを誇る聖職者や学者を揶揄した。","note":"ヨーロッパ各地を旅し、イギリスのモアとも親交を結んだ。","country":"ネーデルラント","field":"文芸・思想","works":[{"t":"『愚神礼賛』"}]},{"id":"rn_more","term":"トマス=モア","read":"とます=もあ","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"文芸・思想"}],"type":"人物","group":"rn:人物:文芸・思想","desc":"エラスムスの友人であるイギリスの人文主義者。キリスト教の天国とは別の理想郷の可能性を示した。","country":"イギリス","field":"文芸・思想","works":[{"t":"『ユートピア』"}]},{"id":"rn_rabelais","term":"ラブレー","read":"らぶれー","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"文芸・思想"}],"type":"人物","group":"rn:人物:文芸・思想","desc":"フランスの人文主義者。ほら話と猥雑な記述で、笑いを人間の本性の1つとして復権させようとした。","note":"医師でもあった。巨人の父子をめぐる長編小説は教会や既成の権威を風刺したため禁書となった。","country":"フランス","field":"文芸・思想","works":[{"t":"『ガルガンチュアとパンタグリュエルの物語』"}]},{"id":"rn_montaigne","term":"モンテーニュ","read":"もんてーにゅ","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"文芸・思想"}],"type":"人物","group":"rn:人物:文芸・思想","desc":"フランスの思想家。随想の形式で人間を考察した作品を残した。","country":"フランス","field":"文芸・思想","works":[{"t":"『エセー（随想録）』"}]},{"id":"rn_cervantes","term":"セルバンテス","read":"せるばんてす","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"文芸・思想"}],"type":"人物","group":"rn:人物:文芸・思想","desc":"スペインの作家。中世の騎士道を風刺した作品を残した。","country":"スペイン","field":"文芸・思想","works":[{"t":"『ドン=キホーテ』"}]},{"id":"rn_shakespeare","term":"シェークスピア","read":"しぇーくすぴあ","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"文芸・思想"}],"type":"人物","group":"rn:人物:文芸・思想","desc":"エリザベス1世時代最大のイギリスの詩人・劇作家。人間の情念を歴史劇で描き出した。","note":"図説では『ハムレット』が、主人公の悲劇的性格を描写した代表作とされる。","country":"イギリス","field":"文芸・思想","works":[{"t":"『ハムレット』"},{"t":"『ヴェニスの商人』"}]},{"id":"rn_machiavelli","term":"マキァヴェリ","read":"まきぁう゛ぇり","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"文芸・思想"}],"type":"人物","group":"rn:人物:文芸・思想","desc":"イタリアの文筆家。君主のあり方を論じた著作で知られる。","note":"教科書本文には登場せず、図説p.134の年表に記載のある人物。","country":"イタリア","field":"文芸・思想","works":[{"t":"『君主論』"}]},{"id":"rn_spenser","term":"エドマンド=スペンサー","read":"えどまんど=すぺんさー","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"文芸・思想"}],"type":"人物","group":"rn:人物:文芸・思想","desc":"エリザベス1世時代のイギリスの詩人。","note":"教科書本文には登場せず、図説p.134の年表に記載のある人物。","country":"イギリス","field":"文芸・思想","works":[{"t":"『妖精の女王』"}]},{"id":"rn_giotto","term":"ジョット","read":"じょっと","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"美術・建築"}],"type":"人物","group":"rn:人物:美術・建築","desc":"ルネサンス様式の祖とされるイタリアの画家。アッシジ出身の修道士を主題とした連作を残した。","note":"図説によれば、その聖母像は師のチマブーエのビザンツ風の平面的な表現に比べ、リアルさも奥行き感も格段に増している。","country":"イタリア","field":"美術・建築","works":[{"t":"「聖フランチェスコの生涯」"}]},{"id":"rn_brunelleschi","term":"ブルネレスキ","read":"ぶるねれすき","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"美術・建築"}],"type":"人物","group":"rn:人物:美術・建築","desc":"イタリアの建築家。古代ローマ建築を取り入れたルネサンス様式のドームを設計した。","country":"イタリア","field":"美術・建築","works":[{"t":"サンタ=マリア大聖堂のドーム"}]},{"id":"rn_donatello","term":"ドナテルロ","read":"どなてるろ","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"美術・建築"}],"type":"人物","group":"rn:人物:美術・建築","desc":"イタリアの彫刻家。聖人を主題とした彫像を残した。","note":"図説p.134には、古代以後初の2本足で立つ独立像といわれる「ダヴィデ像」も掲載されている。ミケランジェロの同名作と混同しないこと。","country":"イタリア","field":"美術・建築","works":[{"t":"「聖ジョルジオ像」"}]},{"id":"rn_botticelli","term":"ボッティチェリ","read":"ぼってぃちぇり","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"美術・建築"}],"type":"人物","group":"rn:人物:美術・建築","desc":"イタリアの画家。ギリシア・ローマ神話の神々を古代さながらの姿で復活させた作品を残した。","note":"「ヴィーナスの誕生」はメディチ家のために描かれたともいわれる。","country":"イタリア","field":"美術・建築","works":[{"t":"「ヴィーナスの誕生」"},{"t":"「春」"}]},{"id":"rn_davinci","term":"レオナルド=ダ=ヴィンチ","read":"れおなるど=だ=う゛ぃんち","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"美術・建築"}],"type":"人物","group":"rn:人物:美術・建築","desc":"「万能人」に象徴されるイタリアの人物。遠近法をたくみに用いた壁画で知られる。","note":"図説には、絵を正確に描くには人体の知識が必要と考えて取り組んだ「解剖手稿」、飛行への関心を示す素描、軍事技師としての活動をうかがわせるミラノ公への手紙が収められている。","country":"イタリア","field":"美術・建築","works":[{"t":"「最後の晩餐」"},{"t":"「モナ=リザ」"}]},{"id":"rn_bramante","term":"ブラマンテ","read":"ぶらまんて","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"美術・建築"}],"type":"人物","group":"rn:人物:美術・建築","desc":"イタリアの建築家。ヴァチカンにあるカトリック教会の総本山の、初代主任建築士をつとめた。","note":"この聖堂の設計にはラファエロ、晩年のミケランジェロも参加した。","country":"イタリア","field":"美術・建築","works":[{"t":"サン=ピエトロ大聖堂"}]},{"id":"rn_michelangelo","term":"ミケランジェロ","read":"みけらんじぇろ","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"美術・建築"}],"type":"人物","group":"rn:人物:美術・建築","desc":"彫刻家を自認したイタリアの芸術家。「神のごとき人」と尊敬され、万能人の典型とされた。","note":"自分の仕事は石に閉じ込められた神の意思を解放することだと考えた。図説には天井画「アダムの創造」、サン=ピエトロ大聖堂の「ピエタ」も掲載されている。「ダヴィデ像」は1504年完成、高さ5.17m。","country":"イタリア","field":"美術・建築","works":[{"t":"「ダヴィデ像」"},{"t":"「最後の審判」"}]},{"id":"rn_raffaello","term":"ラファエロ","read":"らふぁえろ","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"美術・建築"}],"type":"人物","group":"rn:人物:美術・建築","desc":"イタリアの画家。多くの聖母子像を残し、ヴァチカン宮殿「署名の間」に古代の学者たちの集いを描いた。","note":"「アテネの学堂」は、キリスト教の宗教観とギリシア精神を統合する試み。図説には聖母子像の代表として「小椅子の聖母」が掲載されている。","country":"イタリア","field":"美術・建築","works":[{"t":"「アテネの学堂」"}]},{"id":"rn_vaneyck","term":"ファン=アイク兄弟","read":"ふぁん=あいくきょうだい","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"美術・建築"}],"type":"人物","group":"rn:人物:美術・建築","desc":"ネーデルラントの画家。独特の乾性油と樹脂を使う油絵具によって、透明感のある細密描写を確立した。","note":"図説には「アルノルフィニ夫妻の肖像」も掲載されている。","country":"ネーデルラント","field":"美術・建築","works":[{"t":"「ガン（ヘント）の祭壇画」"}]},{"id":"rn_durer","term":"デューラー","read":"でゅーらー","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"美術・建築"}],"type":"人物","group":"rn:人物:美術・建築","desc":"ドイツの画家。","note":"教材では自画像も代表作として挙げられるが、作品名としては一般的すぎるため出題していない。図説によれば、西洋画史上初めての単独自画像を描いたともいわれる。","country":"ドイツ","field":"美術・建築","works":[{"t":"「四人の使徒」"}]},{"id":"rn_bruegel","term":"ブリューゲル","read":"ぶりゅーげる","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"美術・建築"}],"type":"人物","group":"rn:人物:美術・建築","desc":"「農民画家」とも呼ばれたネーデルラントの画家。フランドルの民衆生活を描き、キリスト教とは異なる主題を数多く描いた。","note":"代表作は「農民の踊り」（教科書・年表）と「子どもの遊び」（年表）。","country":"ネーデルラント","field":"美術・建築","works":[{"t":"「農民の踊り」"},{"t":"「子どもの遊び」","ask":false}]},{"id":"rn_copernicus","term":"コペルニクス","read":"こぺるにくす","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"科学・技術"}],"type":"人物","group":"rn:人物:科学・技術","desc":"ポーランドの聖職者。天体観測にもとづき、地動説を理論的に裏づけた。","note":"教会の弾圧を恐れ、公表は死の数日前であった。図説p.134の年表では「ドイツ・東欧」の欄に置かれるが、教科書本文の記載どおりポーランドとする。","country":"ポーランド","field":"科学・技術","works":[{"t":"『天球回転論』"}]},{"id":"x_galilei","term":"ガリレイ","read":"がりれい","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"科学・技術"},{"r":"17〜18世紀ヨーロッパ","s":"自然科学"}],"type":"人物","group":"rn:人物:科学・技術","desc":"イタリアの人物。望遠鏡を改良した。その著作は刊行の翌年に禁書となり、有罪判決を受けて地動説を放棄させられた。","note":"教科書本文には登場せず、図説の年表とp.139に記載のある人物。 17〜18世紀ヨーロッパ文化史（教科書p.199の表）では、望遠鏡の改良を業績とする人物として登場する。","country":"イタリア","field":"科学・技術","works":[{"t":"『二大世界体系対話』"}]},{"id":"rn_bruno","term":"ジョルダーノ=ブルーノ","read":"じょるだーの=ぶるーの","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"科学・技術"}],"type":"人物","group":"rn:人物:科学・技術","desc":"イタリアの人物。地動説を支持し、汎神論をとなえた。","note":"教科書本文には登場せず、図説p.134の年表に記載のある人物。","country":"イタリア","field":"科学・技術"},{"id":"rn_toscanelli","term":"トスカネリ","read":"とすかねり","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"科学・技術"}],"type":"人物","group":"rn:人物:科学・技術","desc":"地球球体説をとなえた人物。天体の動きの観測から導かれた説であった。","country":"イタリア","field":"科学・技術"},{"id":"rn_gutenberg","term":"グーテンベルク","read":"ぐーてんべるく","region":"ルネサンス","mem":[{"r":"ルネサンス","s":"科学・技術"}],"type":"人物","group":"rn:人物:科学・技術","desc":"15世紀半ば、ドイツで活版印刷術を改良した人物。","note":"図説によれば、活字は東アジアで発明されたものだが、アルファベットは漢字と比べて活字をつくりやすかったため、ヨーロッパでは各地へ急速に広まった。","country":"ドイツ","field":"科学・技術"},{"id":"ec_kepler","term":"ケプラー","read":"けぷらー","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"自然科学"}],"type":"人物","group":"ec:人物:自然科学","desc":"ドイツの人物。惑星運行の法則を業績とする。","country":"ドイツ","col":"自然科学"},{"id":"ec_harvey","term":"ハーヴェー","read":"はーゔぇー","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"自然科学"}],"type":"人物","group":"ec:人物:自然科学","desc":"イギリスの人物。血液循環論を業績とする。","country":"イギリス","col":"自然科学"},{"id":"ec_boyle","term":"ボイル","read":"ぼいる","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"自然科学"}],"type":"人物","group":"ec:人物:自然科学","desc":"イギリスの人物。気体力学を業績とする。","note":"資料集の王立協会の図では、背景にボイルの実験装置が描かれている。","country":"イギリス","col":"自然科学"},{"id":"ec_newton","term":"ニュートン","read":"にゅーとん","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"自然科学"}],"type":"人物","group":"ec:人物:自然科学","desc":"イギリスの人物。万有引力の法則を発見し、『プリンキピア』を著した。","note":"資料集では、万有引力の発見などを通じて古典力学を確立し、近代物理学の創始者とされると記載。","country":"イギリス","col":"自然科学"},{"id":"ec_hooke","term":"フック","read":"ふっく","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"自然科学"}],"type":"人物","group":"ec:人物:自然科学","desc":"イギリスの人物。『ミクログラフィア』を著した。","note":"教科書では、自然現象全般に関心をもち、ニュートンと並ぶイギリスの科学研究の推進者となったと記載し、フックが発明した顕微鏡の図を掲載。","country":"イギリス","col":"自然科学"},{"id":"ec_linne","term":"リンネ","read":"りんね","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"自然科学"}],"type":"人物","group":"ec:人物:自然科学","desc":"スウェーデンの人物。植物分類学を業績とする。","country":"スウェーデン","col":"自然科学"},{"id":"ec_lavoisier","term":"ラヴォワジェ","read":"らゔぉわじぇ","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"自然科学"}],"type":"人物","group":"ec:人物:自然科学","desc":"フランスの人物。燃焼理論を業績とする。","country":"フランス","col":"自然科学"},{"id":"ec_jenner","term":"ジェンナー","read":"じぇんなー","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"自然科学"}],"type":"人物","group":"ec:人物:自然科学","desc":"イギリスの人物。牛痘を接種する種痘法を開発した。","note":"資料集では、天然痘は古来より恐れられた伝染病で、乳搾りの女性がかかりにくいことに注目したと記載。","country":"イギリス","col":"自然科学"},{"id":"ec_laplace","term":"ラプラース","read":"らぷらーす","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"自然科学"}],"type":"人物","group":"ec:人物:自然科学","desc":"フランスの人物。宇宙進化論を業績とする。","country":"フランス","col":"自然科学"},{"id":"x_fbacon","term":"フランシス=ベーコン","read":"ふらんしす=べーこん","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"哲学・思想"},{"r":"ルネサンス","s":"文芸・思想"}],"type":"人物","group":"ec:人物:哲学・思想","desc":"イギリスの人物。『新オルガヌム』を著し、観察と実験を重視して、個々の事例から普遍的な法則に到達する帰納法をとなえた。","note":"資料集では「イギリス経験主義を確立した」と記載。教科書では経験主義はロックの姿勢として確立されたと記載。 ルネサンス文化史の教材（図説p.134の年表）ではルネサンス期のイギリスの人文主義者・哲学者として置かれている。","country":"イギリス","col":"哲学・社会科学","eMethod":"ec_kinou","eStance":"ec_keiken","works":[{"t":"『新オルガヌム』"}],"field":"文芸・思想"},{"id":"ec_descartes","term":"デカルト","read":"でかると","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"哲学・思想"}],"type":"人物","group":"ec:人物:哲学・思想","desc":"『方法序説』を著した人物。人間の理性が明晰に正しいと認めるものはすべて真実とみなしてよいとし、普遍的な法則から個々の事例を説明する演繹法をとなえた。","note":"「われ思う、ゆえにわれあり」の言葉で知られ、資料集では近代合理主義哲学の出発点と記載。","country":"フランス","askCountry":true,"col":"哲学・社会科学","eMethod":"ec_eneki","eStance":"ec_gouri"},{"id":"ec_pascal","term":"パスカル","read":"ぱすかる","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"哲学・思想"}],"type":"人物","group":"ec:人物:哲学・思想","desc":"フランスの人物。『パンセ（瞑想録）』を著した。","country":"フランス","col":"哲学・社会科学"},{"id":"ec_spinoza","term":"スピノザ","read":"すぴのざ","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"哲学・思想"}],"type":"人物","group":"ec:人物:哲学・思想","desc":"オランダの人物。『エチカ（倫理学）』を著した。","country":"オランダ","col":"哲学・社会科学"},{"id":"ec_leibniz","term":"ライプニッツ","read":"らいぷにっつ","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"哲学・思想"}],"type":"人物","group":"ec:人物:哲学・思想","desc":"ドイツの人物。『単子論』を著した。","country":"ドイツ","col":"哲学・社会科学"},{"id":"ec_kant","term":"カント","read":"かんと","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"哲学・思想"}],"type":"人物","group":"ec:人物:哲学・思想","desc":"『純粋理性批判』を著した人物。合理主義と経験主義の2つの立場を統合しようと試みた。","note":"資料集では、規則正しい生活を送り、決まった時間に散歩するので町の人々は時刻を知ったという逸話を紹介。","country":"ドイツ","askCountry":true,"col":"哲学・社会科学","eStance":"ec_kannen"},{"id":"ec_grotius","term":"グロティウス","read":"ぐろてぃうす","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"政治思想・法"}],"type":"人物","group":"ec:人物:政治思想・法","desc":"オランダの人物。『海洋自由論』『戦争と平和の法』を著し、自然法の理論を国家関係の分析に適用して、国際法理論を創始した。","country":"オランダ","col":"哲学・社会科学","eTheory":"ec_kokusaihou"},{"id":"ec_hobbes","term":"ホッブズ","read":"ほっぶず","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"政治思想・法"}],"type":"人物","group":"ec:人物:政治思想・法","desc":"イギリスの人物。『リヴァイアサン』を著した。人間を利己的動物ととらえ、自然状態を「万人の万人に対する闘い」とした。","note":"教科書では、自然法を探究する試みがホッブズらによって始められたと記載。資料集の社会契約説の表では、国家（絶対的権力）に自然権を譲渡するとし、王権神授説（絶対王政）を正当化したとある。","country":"イギリス","col":"哲学・社会科学","ePhrase":"ec_bannin"},{"id":"ec_locke","term":"ロック","read":"ろっく","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"政治思想・法"}],"type":"人物","group":"ec:人物:政治思想・法","desc":"『統治二論』を著した人物。人間の思考では生後に獲得される知識と経験が決定的な役割を果たすとして、デカルトの考え方に反対した。","note":"資料集の社会契約説の表では、人民が政府に自然権を信託し、政府に対する抵抗権を容認。名誉革命を正当化し、アメリカ独立革命に影響を与えたとある。","country":"イギリス","askCountry":true,"col":"哲学・社会科学","eStance":"ec_keiken"},{"id":"ec_w_telescope","term":"望遠鏡の改良","read":"ぼうえんきょうのかいりょう","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"自然科学"}],"type":"業績","group":"ec:業績","desc":"ガリレイの業績。","ext":"ガリレイは自作の望遠鏡で、月面の凹凸、木星の衛星、金星の満ち欠け、太陽の黒点などを観測し、地動説を支持した。のちに地動説を擁護したことで宗教裁判にかけられた。","person":"x_galilei"},{"id":"ec_w_planet","term":"惑星運行の法則","read":"わくせいうんこうのほうそく","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"自然科学"}],"type":"業績","group":"ec:業績","desc":"ケプラーの業績。","ext":"ティコ=ブラーエの観測記録をもとに、惑星が太陽を1つの焦点とする楕円軌道を描くことなどを示した3つの法則。地動説を理論面で補強した。","person":"ec_kepler"},{"id":"ec_w_blood","term":"血液循環論","read":"けつえきじゅんかんろん","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"自然科学"}],"type":"業績","group":"ec:業績","desc":"ハーヴェーの業績。","ext":"血液が心臓のポンプのはたらきによって全身を循環することを、実験と観察によって示した（1628年刊『動物の心臓と血液の運動』）。","person":"ec_harvey"},{"id":"ec_w_gas","term":"気体力学","read":"きたいりきがく","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"自然科学"}],"type":"業績","group":"ec:業績","desc":"ボイルの業績。","ext":"温度が一定のとき、気体の体積は圧力に反比例するという「ボイルの法則」で知られる。空気ポンプを用いた実験をおこなった。","person":"ec_boyle"},{"id":"ec_w_gravity","term":"万有引力の法則","read":"ばんゆういんりょくのほうそく","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"自然科学"}],"type":"業績","group":"ec:業績","desc":"ニュートンの業績。","ext":"地上で物体が落下する運動と、天体の運動とを、質量をもつ物体どうしが引き合う同じ力で説明した。","person":"ec_newton"},{"id":"ec_w_principia","term":"『プリンキピア』","read":"ぷりんきぴあ","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"自然科学"}],"type":"業績","group":"ec:業績","desc":"ニュートンの著作。","note":"資料集では『プリンキピア（自然哲学の数学的原理）』と記載。","ext":"1687年刊。運動の3法則と万有引力の法則を数学的に体系化し、古典力学を確立した。","person":"ec_newton"},{"id":"ec_w_micro","term":"『ミクログラフィア』","read":"みくろぐらふぃあ","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"自然科学"}],"type":"業績","group":"ec:業績","desc":"フックの著作。","ext":"1665年刊。自作の顕微鏡による観察記録で、コルクの薄片にみられる小部屋を「細胞（cell）」と名づけた。","person":"ec_hooke"},{"id":"ec_w_plant","term":"植物分類学","read":"しょくぶつぶんるいがく","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"自然科学"}],"type":"業績","group":"ec:業績","desc":"リンネの業績。","ext":"生物を属名と種小名の2語で表す二名法を確立し、動植物を体系的に分類した（主著『自然の体系』）。","person":"ec_linne"},{"id":"ec_w_burn","term":"燃焼理論","read":"ねんしょうりろん","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"自然科学"}],"type":"業績","group":"ec:業績","desc":"ラヴォワジェの業績。","ext":"燃焼は物質と酸素が結びつく現象であることを明らかにし、それまでのフロギストン説を否定した。質量保存の法則でも知られる。徴税請負人であったため、フランス革命中に処刑された。","person":"ec_lavoisier"},{"id":"ec_w_vaccine","term":"種痘法","read":"しゅとうほう","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"自然科学"}],"type":"業績","group":"ec:業績","desc":"ジェンナーの業績。","ext":"1796年、牛痘を人に接種して天然痘を予防する方法を開発した。ワクチン（予防接種）の起源とされる。","person":"ec_jenner"},{"id":"ec_w_cosmos","term":"宇宙進化論","read":"うちゅうしんかろん","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"自然科学"}],"type":"業績","group":"ec:業績","desc":"ラプラースの業績。","ext":"太陽系は、回転するガス状の星雲が収縮してできたとする星雲説。カントも同様の説をとなえたため「カント=ラプラース説」とも呼ばれる。","person":"ec_laplace"},{"id":"ec_w_organum","term":"『新オルガヌム』","read":"しんおるがぬむ","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"哲学・思想"}],"type":"業績","group":"ec:業績","desc":"フランシス=ベーコンの著作。","ext":"1620年刊。題はアリストテレスの論理学書『オルガノン』に対する「新しい道具」の意。人間の偏見（イドラ）を排し、観察と実験にもとづく帰納法を学問の方法として説いた。「知は力なり」の言葉で知られる。","person":"x_fbacon"},{"id":"ec_w_method","term":"『方法序説』","read":"ほうほうじょせつ","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"哲学・思想"}],"type":"業績","group":"ec:業績","desc":"デカルトの著作。","ext":"1637年刊。確実なものに達するまであらゆるものを疑う方法的懐疑を経て「われ思う、ゆえにわれあり」に到達し、そこから明晰な原理にもとづいて推論する方法を説いた。","person":"ec_descartes"},{"id":"ec_w_pensees","term":"『パンセ（瞑想録）』","read":"ぱんせ","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"哲学・思想"}],"type":"業績","group":"ec:業績","desc":"パスカルの著作。","ext":"死後に遺稿をまとめて刊行された。「人間は考える葦である」の言葉で知られ、人間の偉大さと悲惨さを見つめ、キリスト教信仰の意義を説いた。","person":"ec_pascal"},{"id":"ec_w_ethica","term":"『エチカ（倫理学）』","read":"えちか","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"哲学・思想"}],"type":"業績","group":"ec:業績","desc":"スピノザの著作。","ext":"死後の1677年刊。定義・公理・定理という幾何学の形式で論を進め、神と自然を同一視する汎神論の立場から、人間の幸福のあり方を論じた。","person":"ec_spinoza"},{"id":"ec_w_monad","term":"『単子論』","read":"たんしろん","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"哲学・思想"}],"type":"業績","group":"ec:業績","desc":"ライプニッツの著作。","ext":"1714年執筆。世界は分割できない精神的な実体「単子（モナド）」から成り、それらは神によってあらかじめ調和するよう定められている（予定調和）と説いた。","person":"ec_leibniz"},{"id":"ec_w_critique","term":"『純粋理性批判』","read":"じゅんすいりせいひはん","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"哲学・思想"}],"type":"業績","group":"ec:業績","desc":"カントの著作。","ext":"1781年刊。人間の理性がどこまで対象を認識できるのか、その範囲と限界を検討した。この立場は批判哲学と呼ばれる。","person":"ec_kant"},{"id":"ec_w_sea","term":"『海洋自由論』","read":"かいようじゆうろん","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"政治思想・法"}],"type":"業績","group":"ec:業績","desc":"グロティウスの著作。","ext":"1609年刊。海洋はいかなる国家も独占することはできず、すべての国の航行と通商に開かれているべきだと主張した。オランダ東インド会社のアジア進出を背景に、ポルトガルによる海洋の独占に反論したもの。","person":"ec_grotius"},{"id":"ec_w_war","term":"『戦争と平和の法』","read":"せんそうとへいわのほう","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"政治思想・法"}],"type":"業績","group":"ec:業績","desc":"グロティウスの著作。","ext":"1625年刊。三十年戦争の惨禍を背景に、戦争の開始や遂行においても国家が守るべき規範があることを自然法にもとづいて論じた。この著作によりグロティウスは「国際法の祖」と呼ばれる。","person":"ec_grotius"},{"id":"ec_w_leviathan","term":"『リヴァイアサン』","read":"りゔぁいあさん","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"政治思想・法"}],"type":"業績","group":"ec:業績","desc":"ホッブズの著作。","note":"資料集の扉絵では、国王の体に多くの国民が描かれ、国民全員から自然権の譲渡を受けた絶対主権者（王）を示している。","ext":"1651年刊。題は旧約聖書に登場する怪物の名。自然状態を「万人の万人に対する闘い」ととらえ、人々が契約によって主権者に権利を譲渡することで国家が成立すると説き、絶対的な主権を正当化した。","person":"ec_hobbes"},{"id":"ec_w_gov","term":"『統治二論』","read":"とうちにろん","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"政治思想・法"}],"type":"業績","group":"ec:業績","desc":"ロックの著作。","ext":"1690年刊。政府は人民の生命・自由・財産という自然権を守るために信託されたものであり、政府がこれを侵害すれば人民は抵抗し政府を改めることができると論じた。名誉革命を理論的に正当化した。","person":"ec_locke"},{"id":"ec_kagakukakumei","term":"科学革命","read":"かがくかくめい","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"自然科学"}],"type":"概念","group":"ec:変化","desc":"観察と実験を重ねて自然界の法則を解明し、それを検証によって確認するという自然科学の基本的な手続きが確立され、科学協会やアカデミーも創設された一連の変化。","note":"南北アメリカ大陸の「発見」や錬金術・天文学の発達によって、古代ギリシアの著作の権威が崩れたことが背景。"},{"id":"ec_kinou","term":"帰納法","read":"きのうほう","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"哲学・思想"}],"type":"概念","group":"ec:思考法","desc":"観察や実験によって得た個々の事例から共通事項を見出し、普遍的な法則に到達する思考法。","note":"教科書の注では「現象から法則を発見する思考法」。","eBy":"x_fbacon","pair":"ec_eneki"},{"id":"ec_eneki","term":"演繹法","read":"えんえきほう","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"哲学・思想"}],"type":"概念","group":"ec:思考法","desc":"理性を重視し、普遍的な法則から個々の事例を説明する思考法。","note":"教科書の注では「法則から現象を説明する思考法」。","eBy":"ec_descartes","pair":"ec_kinou"},{"id":"ec_gouri","term":"合理主義","read":"ごうりしゅぎ","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"哲学・思想"}],"type":"概念","group":"ec:思想","desc":"理性を万能視する考え方。近世以降のヨーロッパ思想の柱の1つで、秩序と調和を重んじる姿勢を生んだ。","note":"デカルトの哲学により確立。資料集では「大陸合理主義」とも記載。","eBy":"ec_descartes","pair":"ec_keiken"},{"id":"ec_keiken","term":"経験主義","read":"けいけんしゅぎ","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"哲学・思想"}],"type":"概念","group":"ec:思想","desc":"人間の思考では生後に獲得される知識と経験が決定的な役割を果たし、思考の正確さも絶対的なものではなく確実性の違いにすぎないとする姿勢。","note":"教科書ではロックの姿勢として確立されたと記載し、資料集ではフランシス=ベーコンが「イギリス経験主義を確立した」と記載。","pair":"ec_gouri"},{"id":"ec_kannen","term":"ドイツ観念論哲学","read":"どいつかんねんろんてつがく","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"哲学・思想"}],"type":"概念","group":"ec:思想","desc":"合理主義と経験主義の2つの立場を統合しようとする試みから道が開かれた哲学。","note":"教科書の表記は「観念論哲学」、資料集のカントの説明では「ドイツ観念論哲学」。","eBy":"ec_kant"},{"id":"ec_shinpo","term":"進歩主義","read":"しんぽしゅぎ","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"哲学・思想"}],"type":"概念","group":"ec:思想","desc":"17世紀末から18世紀初めの西欧で、古代人と現代人のどちらがすぐれているかの論争に現代人派が勝利したことで優勢となった、人間の歴史はよりよい時代に向かって無限に進歩していくことが可能であるとする考え方。"},{"id":"ec_keimou","term":"啓蒙思想","read":"けいもうしそう","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"哲学・思想"}],"type":"概念","group":"ec:思想","desc":"18世紀に広まった、すべての人間を対象に、現実世界における幸福を増大させるために有用な知識を集積して広めようとする思想。","note":"その思想家たちは国境をこえて議論し、為政者に直接働きかけたり、世論を通じて改革を要求したりした。"},{"id":"ec_kankyo","term":"宗教的寛容","read":"しゅうきょうてきかんよう","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"哲学・思想"}],"type":"概念","group":"ec:宗教上の姿勢","desc":"国家・君主の信仰とは異なる宗派のキリスト教を容認する姿勢。これが広まり、宗教改革以来のヨーロッパにおける宗教的迫害や対立はしだいに収束に向かった。","eBy":"ec_voltaire"},{"id":"ec_shizenhou","term":"自然法","read":"しぜんほう","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"政治思想・法"}],"type":"概念","group":"ec:法","desc":"現実に定められた法である実定法とは別の、理性を備えた人間に普遍的に共通するルールとして想定された法。","note":"その探究はホッブズらによって始められた。","eBy":"ec_hobbes","cross":"法"},{"id":"ec_kokusaihou","term":"国際法","read":"こくさいほう","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"政治思想・法"}],"type":"概念","group":"ec:法","desc":"グロティウスが、自然法の理論を国家関係の分析に適用することで理論を創始した法。","eBy":"ec_grotius","cross":"法"},{"id":"ec_bannin","term":"「万人の万人に対する闘い」","read":"ばんにんのばんにんにたいするたたかい","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"政治思想・法"}],"type":"言葉","group":"ec:言葉","desc":"人間を利己的動物ととらえた思想家が、国家成立以前の自然状態を表現した言葉。","note":"資料集では、この状態から国民を保護するため、国民全員から自然権の譲渡を受けた絶対主権者（王）が必要だとする考え方が『リヴァイアサン』の扉絵に表されていると解説。","eBy":"ec_hobbes"},{"id":"ec_voltaire","term":"ヴォルテール","read":"ゔぉるてーる","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"政治思想・法"}],"type":"人物","group":"ec:人物:政治思想・法","desc":"フランスの啓蒙思想家。その著作によって、国家・君主の信仰とは異なる宗派のキリスト教を容認する姿勢を広めた。","note":"資料集では、イギリス滞在中にロックの思想とともにニュートンの力学に注目したと記載。プロイセンのフリードリヒ2世にまねかれた（教科書p.198）。","country":"フランス","eValue":"ec_kankyo"},{"id":"ec_montesquieu","term":"モンテスキュー","read":"もんてすきゅー","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"政治思想・法"}],"type":"人物","group":"ec:人物:政治思想・法","desc":"フランスの人物。歴史上の諸国家・文明の考察を通じて、イギリスの立憲君主政を例に権力の分立と王権の制限を主張した。","country":"フランス"},{"id":"ec_horeishin","term":"『法の精神』","read":"ほうのせいしん","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"政治思想・法"}],"type":"書物","group":"ec:書物","desc":"モンテスキューが著した書物。歴史上の諸国家・文明を考察し、イギリスの立憲君主政を例に権力の分立と王権の制限を主張した。","person":"ec_montesquieu"},{"id":"ec_rousseau","term":"ルソー","read":"るそー","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"政治思想・法"}],"type":"人物","group":"ec:人物:政治思想・法","desc":"フランスの人物。文明の進展がむしろ人間の自由を制約していると考え、直接民主政のかたちで統治に参加することで自由と平等を回復すべきと論じた。","note":"資料集の社会契約説の表では、人間を自然な善性をもつ未発達な存在ととらえ、フランス革命に影響を与えたとある。","country":"フランス"},{"id":"ec_shakaikeiyaku","term":"『社会契約論』","read":"しゃかいけいやくろん","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"政治思想・法"}],"type":"書物","group":"ec:書物","desc":"ルソーが著した書物。各人が社会と契約してすべての権利を譲渡したうえで、直接民主政のかたちで統治に参加することによって自由と平等を回復すべきと論じた。","person":"ec_rousseau"},{"id":"ec_turgot","term":"テュルゴ","read":"てゅるご","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"経済学"}],"type":"人物","group":"ec:人物:経済学","desc":"フランスの人物。人類社会が農耕中心の自給自足的段階から、分業と交換が世界規模で展開する商業段階へ移行しつつあると考え、古典派経済学を創始した一人。","note":"資料集の経済学の系譜では、重農主義の欄にケネーとともに記載（表記は「テュルゴー」）。","country":"フランス","eTheory":"ec_koten"},{"id":"ec_smith","term":"アダム=スミス","read":"あだむ=すみす","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"経済学"}],"type":"人物","group":"ec:人物:経済学","desc":"イギリスの人物。重商主義的な特権や規制を撤廃し、経済の不都合は市場の自動調節機能に任せるほうがよいとする自由放任の政策を唱えた。","note":"資料集では、公共の利益を意図せず自分の利益を追求することが結果的に社会の利益を促進するという「見えざる手」の考え方を紹介。","country":"イギリス","eTheory":"ec_koten"},{"id":"ec_kokufu","term":"『諸国民の富（国富論）』","read":"しょこくみんのとみ（こくふろん）","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"経済学"}],"type":"書物","group":"ec:書物","desc":"アダム=スミスが著した書物。人類社会が、分業と交換が世界規模で展開する商業段階へ移行しつつあると考え、古典派経済学の出発点となった。","person":"ec_smith"},{"id":"ec_koten","term":"古典派経済学","read":"こてんはけいざいがく","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"経済学"}],"type":"概念","group":"ec:経済学","desc":"人類社会とくに西欧諸国が、農耕を中心とした自給自足的段階から、分業と交換が世界規模で展開する商業段階へ移行しつつあると考えた経済学。","note":"テュルゴとアダム=スミスが創始。資料集の系譜では自由放任主義とされ、マルサス『人口論』、リカード『経済学および課税の原理』が続く。"},{"id":"ec_diderot","term":"ディドロ・ダランベール","read":"でぃどろ・だらんべーる","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"文学・社会"}],"type":"人物","group":"ec:人物:文学・社会","desc":"フランスの人物。啓蒙思想の最大の成果とされる『百科全書』を編纂した。","note":"資料集では、思想のなかにニュートン力学・原子論・機械論などを取り入れたと記載。","country":"フランス"},{"id":"ec_hyakka","term":"『百科全書』","read":"ひゃっかぜんしょ","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"文学・社会"}],"type":"書物","group":"ec:書物","desc":"ディドロやダランベールらが編纂した書物。啓蒙思想の最大の成果とされる百科事典のうち、18世紀のフランスで刊行されたもの。","note":"この時代には各国で百科事典が刊行され、博物館や植物園も登場した。","person":"ec_diderot"},{"id":"ec_yoron","term":"世論の形成","read":"よろんのけいせい","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"文学・社会"}],"type":"概念","group":"ec:社会の変化","desc":"新聞・雑誌などの出版物が、ロンドンやパリのコーヒーハウス・カフェ・クラブ・サロンといった集いの場で読まれ、討論の対象となったことでうながされたもの。","note":"背景は、18世紀後半のヨーロッパで書物に限らず出版業が発達したこと。"},{"id":"ec_bourgeois","term":"ブルジョワ","read":"ぶるじょわ","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"文学・社会"}],"type":"概念","group":"ec:社会層","desc":"都市の商業を基盤に富を蓄積し、上流階級の華やかな宮廷文化とは異なる独自の文化を形成しはじめた人々。啓蒙思想の推進役となった知識人も生んだ。","note":"教科書の表記は「ブルジョワ（市民）」。のちに経済力を基盤に、政治の主導権をめぐって国王ら旧来の支配層と争った。"},{"id":"ec_defoe","term":"デフォー","read":"でふぉー","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"文学・社会"}],"type":"人物","group":"ec:人物:文学・社会","desc":"イギリスの人物。ヨーロッパ外への空想旅行記が流行するなかで、孤島に漂着した男の物語を書き、ベストセラーとなった。","note":"資料集では、様々な商業に従事した山師的商人でもあり、ジャーナリストとしても活動したと記載。","country":"イギリス"},{"id":"ec_robinson","term":"『ロビンソン=クルーソー』","read":"ろびんそん=くるーそー","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"文学・社会"}],"type":"書物","group":"ec:書物","desc":"デフォーが書いた作品。孤島に漂着して労働でいっさいをつくりあげる男の物語で、ヨーロッパ外への空想旅行記の流行のなかでベストセラーとなった。","note":"資料集では、マルクスがこの物語を「資本主義小説」と読んだと紹介。","person":"ec_defoe","cross":"物語・文学作品"},{"id":"ec_swift","term":"スウィフト","read":"すうぃふと","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"文学・社会"}],"type":"人物","group":"ec:人物:文学・社会","desc":"イギリスの人物。架空の国々の旅行記を通して当時のイギリス社会を風刺した作品を書き、ベストセラーとなった。","country":"イギリス"},{"id":"ec_gulliver","term":"『ガリヴァー旅行記』","read":"がりゔぁーりょこうき","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"文学・社会"}],"type":"書物","group":"ec:書物","desc":"スウィフトが書いた作品。主人公が小人国などの架空の国々を旅する物語を通して、当時のイギリス社会を風刺した。","person":"ec_swift","cross":"物語・文学作品"},{"id":"ec_kotenshugi","term":"古典主義","read":"こてんしゅぎ","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"芸術"}],"type":"概念","group":"ec:様式","desc":"合理主義が生んだ秩序と調和を重んじる姿勢が、芸術に反映されたもの。","note":"資料集では、17世紀フランスのコルネイユ・ラシーヌ・モリエールの3大劇作家の作品を紹介。","cross":"様式"},{"id":"ec_baroque","term":"バロック様式","read":"ばろっくようしき","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"芸術"}],"type":"概念","group":"ec:様式","desc":"17世紀を中心にヨーロッパ各国で栄えた芸術様式。名称は「ゆがんだ真珠」という意味のポルトガル語に由来し、激しい動勢や強烈な明暗表現などダイナミックで豪華な表現を特徴とする。","note":"資料集の作品例：ベラスケス「宮廷の侍女たち」、ルーベンス「マリ=ド=メディシスのマルセイユ上陸」、ベルニーニ「聖女テレサの法悦」、レンブラント「夜警」。","pair":"ec_rococo","cross":"様式"},{"id":"ec_rococo","term":"ロココ様式","read":"ろここようしき","region":"17〜18世紀ヨーロッパ","mem":[{"r":"17〜18世紀ヨーロッパ","s":"芸術"}],"type":"概念","group":"ec:様式","desc":"18世紀のフランスを中心に栄えた芸術様式。名称は貝殻状の人造石を意味するフランス語に由来し、優美さ・洗練・官能性、軽妙で装飾性が高いことを特徴とする。","note":"資料集の作品例：ワトー「シテール島への船出」、フラゴナール「ぶらんこ」、プロイセン王フリードリヒ2世がポツダムに建てたサンスーシ宮殿。","pair":"ec_baroque","cross":"様式"}];

/* ---- 苦手語句の記録（localStorage・この端末のブラウザ内のみ）----

   トップページの「苦手語句リスト」がこのデータを読み取って表示する。 */
const WEAK_KEY='tsubame_weak_v1';
function weakRecord(term,read,tag,ok,wt){
  wt=(wt==null)?1:wt;   // 分類問題は0.5など、出題形式に応じた重み
  try{
    const db=JSON.parse(localStorage.getItem(WEAK_KEY)||'{}');
    let e=db[term];
    if(ok){
      if(!e)return;                       // 誤答歴のない語の正答は記録しない
      e.c=Math.round((e.c+wt)*10)/10;
      e.st=(e.st||0)+1;                   // 連続正解数（克服判定用）
      e.last='ok';e.ts=Date.now();
    }else{
      e=e||{t:term,r:read||'',g:'',w:0,c:0,st:0,last:'',ts:0};
      e.w=Math.round((e.w+wt)*10)/10;
      e.st=0;                             // 誤答で連続正解はリセット
      e.last='ng';e.ts=Date.now();
      if(tag){const gs=new Set(String(e.g).split('・').filter(Boolean));String(tag).split('・').forEach(x=>gs.add(x));e.g=[...gs].join('・');}
      if(!e.r&&read)e.r=read;
    }
    db[term]=e;
    localStorage.setItem(WEAK_KEY,JSON.stringify(db));
  }catch(err){/* プライベートブラウズ等、保存できない環境では何もしない */}
}

function stanceLabel(s){return s==='自然科学'?'自然科学の重視':s;}

function explainHTML(d){
  let parts=[];
  const rs=regionsOf(d);
  parts.push(`文化圏：<b>${rs.join('・')}</b>`);
  rs.forEach(r=>{
    const ss=subsIn(d,r).filter(s=>s&&s!=='その他');
    if(ss.length)parts.push(`${rs.length>1?r+'での':''}${SUB_LABEL[r]}：<b>${ss.join('・')}</b>`);
  });
  if(d.faculty)parts.push(`中心学部：<b>${d.faculty}</b>`);
  if(d.style)parts.push(`様式：<b>${d.style}</b>`);
  if(d.country)parts.push(`国：<b>${d.country}</b>`);
  if(d.stance)parts.push(`立場：<b>${stanceLabel(d.stance)}</b>`);
  if(d.theme)parts.push(`題材・性格：<b>${d.theme}</b>`);
  if(d.works&&d.works.length)parts.push(`代表作：<b>${d.works.map(w=>w.t).join('・')}</b>`);
  if(inRegion(d,'17〜18世紀ヨーロッパ')){
    if(d.type==='人物'){
      const shown=new Set((d.works||[]).map(w=>w.t));
      const ws=DATA.filter(x=>x.person===d.id&&!shown.has(x.term));
      if(ws.length)parts.push(`業績・著作：<b>${ws.map(w=>w.term).join('、')}</b>`);
      Object.entries(EC_LINK_LABEL).forEach(([k,lb])=>{if(d[k]){const x=byId(d[k]);if(x)parts.push(`${lb}：<b>${x.term}</b>`);}});
    }else if(!d.person){
      const rel=DATA.filter(x=>x.type==='人物'&&Object.keys(EC_LINK_LABEL).some(k=>x[k]===d.id));
      if(d.eBy&&!rel.some(x=>x.id===d.eBy))rel.unshift(byId(d.eBy));
      if(rel.length)parts.push(`関連する人物：<b>${rel.map(x=>x.term).join('、')}</b>`);
    }
  }
  if(d.work){const w=byId(d.work);if(w)parts.push(`作品：<b>${w.term}</b>`);}
  if(d.person){const p=byId(d.person);if(p)parts.push(`${d.type==='業績'?'人物':(d.type==='書物'||d.type==='作品')?'作者':'関係人物'}：<b>${p.term}</b>`);}
  // 携帯でスクロールしても何の語の解説かわかるよう、冒頭に正解の語を再掲する
  let s=`<div class="explain"><span class="ttl">解説</span><div style="font-weight:700;font-size:15px;margin:2px 0 6px">${d.term}<span style="font-weight:400;font-size:12px;color:var(--ink-soft)">（${d.read}）</span></div>${d.desc}`;
  if(d.note)s+=`<br><span style="color:var(--ink-soft)">※ ${d.note}</span>`;
  if(d.ext)s+=`<br><span style="color:var(--ink-soft)">※ 教材外の補足：${d.ext}</span>`;
  s+=`<br><br>${parts.join('　／　')}</div>`;
  return s;
}
