/* ---- モードA：説明 → 語を選ぶ ---- */
function distractorsFor(d){
  // 説明文が出題語と同一の語は誤答にしない（モードAで正解が一意でなくなるため）
  const uniqPush=(arr,x)=>{if(x&&x.id!==d.id&&x.term!==d.term&&x.desc!==d.desc&&!isAchv(x)&&!arr.some(y=>y.term===x.term))arr.push(x);};
  let ordered=[];
  if(d.type==='人物'){
    if(d.region==='中国'){
      // 中国の人物は中国内のみ（漢字名と片仮名名は混ざらない）
      const cn=DATA.filter(x=>x.type==='人物'&&x.region==='中国'&&x.id!==d.id);
      const same=shuffle(cn.filter(x=>x.mem.some(m=>d.mem.some(n=>n.s===m.s))));
      const other=shuffle(cn.filter(x=>!same.includes(x)));
      [...same,...other].forEach(x=>uniqPush(ordered,x));
    }else{
      const own=DATA.filter(x=>x.type==='人物'&&x.region===d.region&&x.id!==d.id);
      // 2人一組の正解（ディドロ・ダランベール）は、同じ形の組を誤答に混ぜて形で絞れないようにする
      if(d.id==='ec_diderot')sample(PAIR_GENERALS,2).forEach(t=>uniqPush(ordered,{term:t[0],read:t[1],id:'g_'+t[0]}));
      const sameSub=shuffle(own.filter(x=>x.group===d.group));
      const cross=shuffle(DATA.filter(x=>x.type==='人物'&&x.region!==d.region&&x.region!=='中国'&&x.id!==d.id));
      // 同地域2 ＋ 他地域1 を基本形にする
      sameSub.slice(0,2).forEach(x=>uniqPush(ordered,x));
      cross.slice(0,1).forEach(x=>uniqPush(ordered,x));
      shuffle(own).forEach(x=>uniqPush(ordered,x));
      (PERSON_GENERALS[d.group]||PERSON_GENERALS['pg:'+REGION_CODE[d.region]]||[]).forEach(t=>uniqPush(ordered,{term:t[0],read:t[1],id:'g_'+t[0]}));
      cross.slice(1).forEach(x=>uniqPush(ordered,x));
    }
  }else{
    const sameLocal=shuffle(DATA.filter(x=>x.id!==d.id&&x.group&&x.group===d.group));
    const crossMates=d.cross?shuffle(DATA.filter(x=>x.id!==d.id&&x.cross===d.cross&&x.group!==d.group)):[];
    const generals=(GENERALS[d.group]||[]).map(t=>({term:t[0],read:t[1],id:'g_'+t[0]}));
    // 他地域の同系統1 ＋ 同地域の同系統2 を基本形にする
    crossMates.slice(0,1).forEach(x=>uniqPush(ordered,x));
    sameLocal.slice(0,2).forEach(x=>uniqPush(ordered,x));
    shuffle(generals).forEach(x=>uniqPush(ordered,x));
    sameLocal.slice(2).forEach(x=>uniqPush(ordered,x));
    crossMates.slice(1).forEach(x=>uniqPush(ordered,x));
    if(ordered.length<3){
      shuffle(DATA.filter(x=>x.id!==d.id&&x.type===d.type&&x.region===d.region)).forEach(x=>uniqPush(ordered,x));
    }
  }
  let distract=ordered.slice(0,3);
  // 対立概念（実在論⇔唯名論、ロマネスク⇔ゴシック）は、対の語を誤答に必ず含める
  if(d.pair){
    const pw=byId(d.pair);
    if(pw&&!distract.some(x=>x.id===pw.id))distract=[pw,...distract.filter(x=>x.id!==pw.id)].slice(0,3);
  }
  return shuffle(distract);
}

function renderModeA(){
  const d=state.pool[state.idx];
  const distract=distractorsFor(d);
  let opts=shuffle([d,...distract]);
  opts=[...opts,{term:'わからない',read:'',id:'__dk__',dk:true}];
  const body=document.getElementById('quizBody');
  body.innerHTML=`<div class="card">
    <div class="prompt-label">この説明にあてはまる語は？</div>
    <div class="prompt-desc">${d.desc}</div>
    <div class="opts" id="opts"></div>
    <div class="actions"><button class="btn btn-primary" id="answerA" disabled>解答する</button></div>
    <div id="afterA"></div>
  </div>`;
  const oc=document.getElementById('opts');
  const marks=['一','二','三','四','五','六','七'];
  let selIdx=-1;
  opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt'+(o.dk?' dk':'');
    const rd=o.read?`<span style="color:var(--ink-soft);font-size:12px">（${o.read}）</span>`:'';
    b.innerHTML=`<span class="mk">${o.dk?'？':marks[i]}</span><span>${o.term}${rd}</span>`;
    b.addEventListener('click',()=>{
      if(state.answeredCurrent)return;
      selIdx=i;
      [...oc.children].forEach(c=>c.classList.remove('selected'));
      b.classList.add('selected');
      document.getElementById('answerA').disabled=false;
    });
    oc.appendChild(b);
  });
  document.getElementById('answerA').addEventListener('click',()=>{
    if(state.answeredCurrent||selIdx<0)return;
    state.answeredCurrent=true;
    const o=opts[selIdx];
    const ok=o.id===d.id;
    if(ok)state.correct++; else state.wrong.push({type:'item',id:d.id});
    weakRecord(d.term,d.read,regionsOf(d).join('・'),ok);
    [...oc.children].forEach((c,ci)=>{
      c.disabled=true;c.classList.remove('selected');
      const oo=opts[ci];
      const isCorrect=oo.id===d.id;
      const isPicked=(ci===selIdx);
      if(isCorrect)c.classList.add('correct');
      else if(isPicked && !oo.dk)c.classList.add('wrong');
      else c.classList.add('dim');
      if(isPicked && !oo.dk)addBadge(c,'あなたの解答','your');
      if(isCorrect)addBadge(c,'正しい選択肢','ans');
    });
    document.getElementById('answerA').disabled=true;
    document.getElementById('afterA').innerHTML=verdict(ok)+explainHTML(d)+nextBtnHTML();
    bindNext();
  });
}

/* ---- モードB：語 → 文化圏＋属性をまとめて答える ---- */
const FACULTIES=['神学','法学','医学','哲学','自然科学'];
const U_COUNTRIES=['イタリア','フランス','イギリス','ドイツ'];
const B_COUNTRIES=['イタリア','フランス','ドイツ','イギリス'];
const STYLES=['ロマネスク様式','ゴシック様式','ビザンツ様式','バシリカ様式'];
const STANCES=['実在論','唯名論','自然科学の重視','教父哲学'];
const THEMES=['カール大帝時代の騎士の武勲が題材','ゲルマンの英雄叙事詩','イギリスのケルト人の伝説から発展','宮廷における騎士の恋愛をうたう叙情詩'];

// 選択肢 val の配列＋validSet（複数正解対応）で設問を作る
function makeQ(ask,optionVals,validSet){
  const opts=optionVals.map(v=>({val:v,label:v}));
  opts.push({val:'__dk__',label:'わからない',dk:true});
  return {ask,options:opts,validSet,picked:null,locked:false};
}
function fixedChoiceQ(ask,answer,pool,nOpt){
  const others=pool.filter(x=>x!==answer);
  return makeQ(ask,shuffle([answer,...sample(others,Math.min(nOpt-1,others.length))]),[answer]);
}
function pickItemQ(ask,target,filterFn,generals){
  let cand=DATA.filter(x=>x.id!==target.id&&filterFn(x)).map(x=>({id:x.id,term:x.term,read:x.read}));
  if(generals)cand=cand.concat(generals.map(t=>({id:'g_'+t[0],term:t[0],read:t[1]})));
  const opts=shuffle([{id:target.id,term:target.term,read:target.read},...sample(cand,3)])
    .map(x=>({val:x.id,label:`${x.term}${x.read?`（${x.read}）`:''}`}));
  opts.push({val:'__dk__',label:'わからない',dk:true});
  return {ask,options:opts,validSet:[target.id],picked:null,locked:false};
}

function buildQuestionsFor(d){
  const qs=[];
  // 問1：文化圏（複数所属の語はいずれも正解）
  qs.push(makeQ('この語はどの文化圏の文化史で学ぶ語か？',REGIONS.slice(),regionsOf(d)));
  // 問2以降：主所属の地域に応じた属性
  const r=d.region;
  if(r==='中国'){
    const subs=subsIn(d,'中国');
    const others=CN_ERAS.filter(e=>!subs.includes(e));
    qs.push(makeQ('中国のどの時代の文化か？',shuffle([...subs,...sample(others,Math.max(1,4-subs.length))]),subs));
  }else if(r==='ギリシア・ローマ'){
    const subs=subsIn(d,'ギリシア・ローマ');
    qs.push(makeQ('ギリシア・ローマ文化史での区分は？',shuffle(GR_ERAS.slice()),subs));
  }else if(r==='イスラーム'){
    const subs=subsIn(d,'イスラーム').filter(s=>s!=='その他');
    if(subs.length)qs.push(makeQ('イスラーム文化史での分野は？',shuffle(IS_FIELDS.slice()),subs));
  }else if(r==='中世ヨーロッパ'){
    if(d.type==='大学'){
      qs.push(fixedChoiceQ('この大学の中心学部は？',d.faculty,FACULTIES,4));
      qs.push(fixedChoiceQ('この大学がある国は？',d.country,U_COUNTRIES,4));
    }else if(d.type==='建築物'){
      qs.push(fixedChoiceQ('この建築の様式は？',d.style,STYLES,4));
      qs.push(fixedChoiceQ('この建築がある国は？',d.country,B_COUNTRIES,4));
    }else if(d.type==='人物'&&d.stance){
      qs.push(fixedChoiceQ('この人物の立場・分野は？',stanceLabel(d.stance),STANCES,4));
      if(d.work){const w=byId(d.work);if(w)qs.push(pickItemQ('この人物の著作は？',w,()=>false,GENERALS['me:神学書']));}
    }else if(d.person&&d.region==='中世ヨーロッパ'){
      const p=byId(d.person);
      if(p)qs.push(pickItemQ('この書物の著者は？',p,x=>x.type==='人物'&&x.region==='中世ヨーロッパ'));
    }else if(d.theme){
      qs.push(fixedChoiceQ('この作品の題材・性格は？',d.theme,THEMES,4));
    }
  }
  // 中国・ギリシア＝ローマ・イスラームの作者⇔作品リンク
  if(['中国','ギリシア・ローマ','イスラーム'].includes(r)){
    if(d.work){const w=byId(d.work);if(w)qs.push(pickItemQ('この人物に関わる作品は？',w,x=>(x.type==='書物'||x.type==='作品')&&x.region===d.region));}
    if(d.person){
      const p=byId(d.person);
      // 書物・作品は「作者」、学派・暦・法典などの概念は「関係の深い人物」と問う
      const ask=(d.type==='書物'||d.type==='作品')?'この作品の作者は？':'この語と関係の深い人物は？';
      if(p)qs.push(pickItemQ(ask,p,x=>x.type==='人物'&&x.region===d.region));
    }
  }
  // ルネサンス・17〜18世紀ヨーロッパ：所属するそれぞれの演習の属性を問う（両方に所属する語は両方）
  if(inRegion(d,'ルネサンス'))rnQuestions(d).forEach(q=>qs.push(q));
  if(inRegion(d,'17〜18世紀ヨーロッパ'))ecQuestions(d).forEach(q=>qs.push(q));
  // 最終問：語の説明として正しいものを選ぶ（説明文からのリーク防止のため必ず最後）
  // 表の業績は説明が「〜の業績。」のみで人物の設問と重なるため出さない
  const dd=isAchv(d)?[]:descDistractors(d);
  if(dd.length===3){
    const opts=shuffle([{val:d.id,label:d.desc},...dd.map(x=>({val:x.id,label:x.desc}))]);
    opts.push({val:'__dk__',label:'わからない',dk:true});
    qs.push({ask:'この語の説明として正しいものは？',options:opts,validSet:[d.id],picked:null,locked:false});
  }
  return qs;
}


/* ---- ルネサンス：国・分野・代表作 ---- */
const RN_COUNTRIES=['イタリア','イギリス','フランス','スペイン','ネーデルラント','ドイツ','ポーランド'];
const RN_FIELDS=['文芸・思想','美術・建築','科学・技術'];
function rnQuestions(d){
  const qs=[];
  if(d.type!=='人物'||!d.field)return qs;
  qs.push(fixedChoiceQ('この人物の国は？',d.country,RN_COUNTRIES,4));
  qs.push(fixedChoiceQ('ルネサンス文化史での、この人物の分野は？',d.field,RN_FIELDS,3));
  if(d.works&&d.works.length){
    const mine=new Set(d.works.map(w=>w.t));
    const ans=sample([...mine],1)[0];
    const same=[],other=[];
    DATA.forEach(x=>{if(x.id===d.id||!x.works)return;x.works.forEach(w=>{if(!mine.has(w.t))(x.field===d.field?same:other).push(w.t);});});
    const pool=[...new Set([...shuffle(same),...shuffle(WORK_GENERALS),...shuffle(other)])].slice(0,3);
    qs.push(makeQ('この人物の代表作は？',shuffle([ans,...pool]),[ans]));
  }
  return qs;
}

/* ---- 17〜18世紀ヨーロッパ：人物⇔業績・著作・思想 ---- */
const EC_LINK_LABEL={eMethod:'思考法',eStance:'思想の立場',eTheory:'創始したもの',ePhrase:'言葉',eValue:'広めた姿勢'};
const EC_COUNTRIES=['イギリス','フランス','ドイツ','オランダ','イタリア'];
const EC_METHODS=['帰納法','演繹法'];
const EC_STANCES=['合理主義','経験主義','ドイツ観念論哲学','進歩主義'];
const EC_PHRASES=['「万人の万人に対する闘い」','「われ思う、ゆえにわれあり」','「見えざる手」','「人間は考える葦である」','「知は力なり」'];
const EC_VALUES=['宗教的寛容','政教分離','予定説','反宗教改革','国家教会主義'];
// テュルゴは資料集で重農主義の欄にあるため、重農主義を選択肢に出さない
const EC_THEORY_POOL={ec_grotius:['国際法','実定法','慣習法','ローマ法','万民法'],ec_smith:['古典派経済学','重商主義','重農主義','マルクス経済学'],ec_turgot:['古典派経済学','重商主義','マルクス経済学','近代経済学']};
const EC_THEORY_ASK={ec_grotius:'この人物が理論を創始した法は？',ec_smith:'この人物が創始した経済学は？',ec_turgot:'この人物が創始した経済学は？'};
const EC_BY_ASK={ec_kinou:'この思考法をとなえた人物は？',ec_eneki:'この思考法をとなえた人物は？',ec_gouri:'この立場を確立した人物は？',ec_kannen:'この哲学への道を開いた人物は？',ec_kankyo:'著作によってこの姿勢を広めた人物は？',ec_shizenhou:'この法の探究を始めた人物は？',ec_kokusaihou:'この法の理論を創始した人物は？',ec_bannin:'この言葉で自然状態を表現した人物は？'};
// 教材上、正解と紛らわしくなる人物は誤答から外す
const EC_BY_EXCLUDE={ec_gouri:['ec_spinoza','ec_leibniz'],ec_eneki:['ec_spinoza','ec_leibniz'],ec_shizenhou:['ec_grotius','ec_locke','ec_rousseau'],ec_kokusaihou:['ec_hobbes'],ec_bannin:['ec_locke','ec_rousseau']};
const isBookTerm=x=>x.term.startsWith('『');

function ecItemQ(ask,target,cands){
  const seen=new Set([target.id,target.term]);const pick=[];
  for(const c of cands){if(pick.length>=3)break;if(seen.has(c.id)||seen.has(c.term))continue;seen.add(c.id);seen.add(c.term);pick.push(c);}
  const opts=shuffle([target,...pick]).map(x=>({val:x.id,label:`${x.term}${x.read?`（${x.read}）`:''}`}));
  opts.push({val:'__dk__',label:'わからない',dk:true});
  return {ask,options:opts,validSet:[target.id],picked:null,locked:false};
}
// 17〜18世紀の人物の誤答候補：同じ分野・同じ国を優先し、他の演習の人物は混ぜない（人物と業績の対応を問うため）
function ecPersonCands(p,exclude){
  const ex=new Set([p.id,...(exclude||[])]);
  const inList=DATA.filter(x=>x.type==='人物'&&inRegion(x,'17〜18世紀ヨーロッパ')&&!ex.has(x.id));
  const cat=x=>(x.mem.find(m=>m.r==='17〜18世紀ヨーロッパ')||{}).s;
  const pc=cat(p);
  const pairs=(p.id==='ec_diderot')?sample(PAIR_GENERALS,2).map(t=>({term:t[0],read:t[1],id:'g_'+t[0]})):[];
  const general=(PERSON_GENERALS['pg:ec']||[]).map(t=>({term:t[0],read:t[1],id:'g_'+t[0]})).filter(g=>!pairs.some(pr=>pr.term.split('・').includes(g.term)));
  return [...pairs,...shuffle(inList.filter(x=>cat(x)===pc&&x.country===p.country)),
    ...shuffle([...inList.filter(x=>cat(x)===pc&&x.country!==p.country),...(['経済学','文学・社会'].includes(pc)?general:[])]),
    ...shuffle(inList.filter(x=>cat(x)!==pc))];
}
function ecQuestions(d){
  const qs=[];
  if(d.type==='人物'){
    const ws=DATA.filter(x=>x.person===d.id);
    // ルネサンスでも代表作を問う人物（フランシス=ベーコン）は、同じ著作を重ねて問わない
    const already=new Set((d.works||[]).map(w=>w.t));
    const ws2=ws.filter(w=>!already.has(w.term));
    if(ws2.length){
      const w=ws2[Math.floor(Math.random()*ws2.length)];
      const own=new Set(ws.map(x=>x.id));
      const pool=DATA.filter(x=>inRegion(x,'17〜18世紀ヨーロッパ')&&(x.type==='業績'||x.type==='書物')&&!own.has(x.id));
      const cat=x=>(x.mem.find(m=>m.r==='17〜18世紀ヨーロッパ')||{}).s;
      const pc=cat(d);
      const cands=[...shuffle(pool.filter(x=>isBookTerm(x)===isBookTerm(w)&&cat(x)===pc)),...shuffle(pool.filter(x=>isBookTerm(x)===isBookTerm(w)&&cat(x)!==pc)),...shuffle(pool.filter(x=>isBookTerm(x)!==isBookTerm(w)))];
      const ask=d.id==='ec_diderot'?'この人物が編纂した書物は？':(isBookTerm(w)?'この人物の著作は？':'この人物の業績は？');
      qs.push(ecItemQ(ask,w,cands));
    }
    if(d.askCountry)qs.push(fixedChoiceQ('この人物の国は？',d.country,EC_COUNTRIES,4));
    if(d.eMethod)qs.push(fixedChoiceQ('この人物がとなえた思考法は？',byId(d.eMethod).term,EC_METHODS,2));
    if(d.eStance)qs.push(fixedChoiceQ('この人物に結びつく思想の立場は？',byId(d.eStance).term,EC_STANCES,4));
    if(d.eTheory)qs.push(fixedChoiceQ(EC_THEORY_ASK[d.id],byId(d.eTheory).term,EC_THEORY_POOL[d.id],4));
    if(d.ePhrase)qs.push(fixedChoiceQ('この人物に結びつく言葉は？',byId(d.ePhrase).term,EC_PHRASES,4));
    if(d.eValue)qs.push(fixedChoiceQ('この人物が著作によって広めた姿勢は？',byId(d.eValue).term,EC_VALUES,4));
  }else if(d.person){
    const p=byId(d.person);
    const ask=d.person==='ec_diderot'?'この書物を編纂した人物は？':(isBookTerm(d)?'この書物の著者は？':'この業績を残した人物は？');
    if(p)qs.push(ecItemQ(ask,p,ecPersonCands(p)));
  }else if(d.eBy){
    const p=byId(d.eBy);
    if(p)qs.push(ecItemQ(EC_BY_ASK[d.id]||'この語に結びつく人物は？',p,ecPersonCands(p,EC_BY_EXCLUDE[d.id])));
  }
  return qs;
}

// 説明文どうしを並べる設問の誤答：モードAと同じ系統選定を使い、
// 説明文を持たない一般誤答（g_）は除いてリスト内の語で補充する
function descDistractors(d){
  let picked=distractorsFor(d).filter(x=>!String(x.id).startsWith('g_')&&x.desc);
  const notAchv=x=>!isAchv(x);
  // 誤答どうしでも説明文が同一なら1つに絞る
  {const seen=new Set([d.desc]);picked=picked.filter(x=>{if(seen.has(x.desc))return false;seen.add(x.desc);return true;});}
  const usedId=new Set([d.id,...picked.map(x=>x.id)]);
  const usedDesc=new Set([d.desc,...picked.map(x=>x.desc)]);
  const sub=d.mem[0]&&d.mem[0].s;
  const fill=[
    ...DATA.filter(x=>x.group===d.group),
    ...(d.cross?DATA.filter(x=>x.cross===d.cross):[]),
    ...DATA.filter(x=>x.type===d.type&&x.region===d.region),
    ...DATA.filter(x=>x.region===d.region&&x.mem.some(m=>m.s===sub)),
    ...DATA.filter(x=>x.region===d.region),
    ...DATA.filter(x=>x.type===d.type)
  ];
  for(const f of fill.length?shuffle(fill.filter(notAchv)):[]){
    if(picked.length>=3)break;
    if(!usedId.has(f.id)&&!usedDesc.has(f.desc)){picked.push(f);usedId.add(f.id);usedDesc.add(f.desc);}
  }
  return picked.slice(0,3);
}

function renderModeB(){
  const d=state.pool[state.idx];
  const questions=buildQuestionsFor(d);
  if(questions.length===1)renderModeB_single(d,questions[0]);
  else renderModeB_multi(d,questions);
}

function renderModeB_single(d,q){
  const body=document.getElementById('quizBody');
  body.innerHTML=`<div class="card">
    <div class="prompt-label">${q.ask}</div>
    <div class="prompt-term"><span class="rb">${d.read}</span>${d.term}</div>
    <div class="opts" id="opts" style="margin-top:18px"></div>
    <div class="actions"><button class="btn btn-primary" id="answerB" disabled>解答する</button></div>
    <div id="afterB"></div>
  </div>`;
  const oc=document.getElementById('opts');
  const marks=['一','二','三','四','五','六','七'];
  let selVal=null;
  q.options.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt'+(o.dk?' dk':'');b.dataset.val=o.val;
    b.innerHTML=`<span class="mk">${o.dk?'？':marks[i]}</span><span>${o.label}</span>`;
    b.addEventListener('click',()=>{
      if(state.answeredCurrent)return;
      selVal=o.val;
      [...oc.children].forEach(c=>c.classList.remove('selected'));
      b.classList.add('selected');
      document.getElementById('answerB').disabled=false;
    });
    oc.appendChild(b);
  });
  document.getElementById('answerB').addEventListener('click',()=>{
    if(state.answeredCurrent||selVal==null)return;
    state.answeredCurrent=true;
    const ok=q.validSet.includes(selVal);
    if(ok)state.correct++; else state.wrong.push({type:'item',id:d.id});
    weakRecord(d.term,d.read,regionsOf(d).join('・'),ok);
    [...oc.children].forEach(c=>{
      c.disabled=true;c.classList.remove('selected');
      const v=c.dataset.val;
      const isAns=q.validSet.includes(v);
      const isPicked=(v===selVal);
      if(isAns)c.classList.add('correct');
      else if(isPicked && v!=='__dk__')c.classList.add('wrong');
      else c.classList.add('dim');
      if(isPicked && v!=='__dk__')addBadge(c,'あなたの解答','your');
      if(isAns)addBadge(c,'正しい選択肢','ans');
    });
    document.getElementById('answerB').disabled=true;
    document.getElementById('afterB').innerHTML=verdict(ok)+explainHTML(d)+nextBtnHTML();
    bindNext();
  });
}

// 設問を1つずつ表示する逐次方式。決定した設問はその場で採点・正誤表示し、
// 正しい前提の上で次の設問に進む（後の設問文が前の設問の答えを含んでも矛盾しない）。
function renderModeB_multi(d,questions){
  const body=document.getElementById('quizBody');
  body.innerHTML=`<div class="card">
    <div class="prompt-label">次の語について答えてください（設問は1つずつ・決定するとその場で採点されます）</div>
    <div class="prompt-term"><span class="rb">${d.read}</span>${d.term}</div>
    <div id="qblocks"></div>
    <div id="afterB"></div>
  </div>`;

  const qb=document.getElementById('qblocks');
  let allOK=true;

  // 決定した設問をその場で採点し、正誤を返す
  function gradeOne(q){
    const okThis=q.validSet.includes(q.picked);
    [...q.el.children].forEach(c=>{
      c.disabled=true;c.classList.remove('selected');
      const v=c.dataset.val;
      const isAns=q.validSet.includes(v);
      const isPicked=(v===q.picked);
      if(isAns)c.classList.add('correct');
      else if(isPicked && v!=='__dk__')c.classList.add('wrong');
      else c.classList.add('dim');
      if(isPicked && v!=='__dk__')addBadge(c,'あなたの解答','your');
      if(isAns)addBadge(c,'正しい選択肢','ans');
    });
    // 設問見出しの右に小さく○×を出す
    q.askEl.insertAdjacentHTML('beforeend',
      okThis?'<span style="color:#3a5a22;margin-left:8px">○</span>'
            :'<span style="color:#8a3322;margin-left:8px">×</span>');
    return okThis;
  }

  function finishItem(){
    state.answeredCurrent=true;
    if(allOK)state.correct++; else state.wrong.push({type:'item',id:d.id});
    weakRecord(d.term,d.read,regionsOf(d).join('・'),allOK);
    document.getElementById('afterB').innerHTML=
      verdict(allOK)
      +`<p style="font-size:12px;color:var(--ink-soft);margin:8px 0 0">${allOK?'すべての設問に正解しました。':'設問に誤りがあります（全問正解で1点）。'}</p>`
      +explainHTML(d)+nextBtnHTML();
    bindNext();
  }

  function showQuestion(qi){
    const q=questions[qi];
    const last=(qi===questions.length-1);
    const blk=document.createElement('div');blk.className='qblock';
    blk.innerHTML=`<div class="q-ask"><span class="q-no">問${qi+1}</span>${q.ask}</div><div class="opts"></div>
      <div class="actions" style="margin-top:12px"><button class="btn btn-primary" disabled>${last?'決定する':'決定して次の設問へ'}</button></div>`;
    qb.appendChild(blk);
    const oc=blk.querySelector('.opts');
    const decideBtn=blk.querySelector('button');
    q.askEl=blk.querySelector('.q-ask');
    const marks=['一','二','三','四','五','六','七'];
    q.options.forEach((o,i)=>{
      const b=document.createElement('button');
      b.className='opt'+(o.dk?' dk':'');b.dataset.val=o.val;
      b.innerHTML=`<span class="mk">${o.dk?'？':marks[i]}</span><span>${o.label}</span>`;
      b.addEventListener('click',()=>{
        if(q.locked)return;
        [...oc.children].forEach(c=>c.classList.remove('selected'));
        b.classList.add('selected');q.picked=o.val;
        decideBtn.disabled=false;
      });
      oc.appendChild(b);
    });
    q.el=oc;
    decideBtn.addEventListener('click',()=>{
      if(q.locked||q.picked==null)return;
      q.locked=true;
      decideBtn.parentElement.remove();   // 決定ボタンを消す
      if(!gradeOne(q))allOK=false;        // その場で採点
      if(last)finishItem();
      else showQuestion(qi+1);
    });
    blk.scrollIntoView({behavior:'smooth',block:'nearest'});
  }

  showQuestion(0);
}

/* ---- モードC：分類（複数選択・5択） ---- */
function renderModeC(){
  const task=CTASKS[state.pool[state.idx]];
  const correctAll=DATA.filter(d=>taskTest(task,d));
  const sameRegionOther=DATA.filter(d=>!taskTest(task,d)&&inRegion(d,task.r));
  const otherRegion=DATA.filter(d=>!inRegion(d,task.r));
  const nCorrect=Math.max(1,Math.min(3,correctAll.length,1+Math.floor(Math.random()*3)));
  const chosenCorrect=sample(correctAll,nCorrect);
  // 誤答：同地域の別区分と他地域を必ず混ぜる
  let wrongs=[];
  const nWrong=5-nCorrect;
  if(task.s!=null&&sameRegionOther.length)wrongs.push(sample(sameRegionOther,1)[0]);
  if(wrongs.length<nWrong&&otherRegion.length)wrongs.push(sample(otherRegion,1)[0]);
  const restPool=shuffle([...sameRegionOther,...otherRegion]).filter(x=>!wrongs.includes(x));
  while(wrongs.length<nWrong&&restPool.length)wrongs.push(restPool.pop());
  const items=shuffle([...chosenCorrect,...wrongs]);
  const picked=new Set();

  const body=document.getElementById('quizBody');
  body.innerHTML=`<div class="card">
    <div class="prompt-label">次のうち、${task.label}にあてはまるものを<b style="color:var(--ink)">すべて</b>選んでください</div>
    <div class="prompt-sub">あてはまる語は1つとは限りません。</div>
    <div class="opts" id="optsC"></div>
    <div class="actions"><button class="btn btn-primary" id="gradeC">採点する</button><button class="btn btn-ghost" id="dkC">わからない</button></div>
    <div id="afterC"></div>
  </div>`;
  const oc=document.getElementById('optsC');
  items.forEach(it=>{
    const b=document.createElement('button');
    b.className='opt';b.dataset.id=it.id;
    b.innerHTML=`<span class="mk">□</span><span>${it.term}<span style="color:var(--ink-soft);font-size:12px">（${it.read}）</span></span>`;
    b.addEventListener('click',()=>{
      if(state.answeredCurrent)return;
      const on=picked.has(it.id);
      if(on){picked.delete(it.id);b.querySelector('.mk').textContent='□';b.classList.remove('selected');}
      else{picked.add(it.id);b.querySelector('.mk').textContent='■';b.classList.add('selected');}
    });
    oc.appendChild(b);
  });
  function settleC(forceWrong){
    if(state.answeredCurrent)return;state.answeredCurrent=true;
    let ok=!forceWrong;
    [...oc.children].forEach(c=>{
      c.disabled=true;c.classList.remove('selected');
      const it=items.find(x=>x.id===c.dataset.id);
      const isCorrect=taskTest(task,it);
      {const _t=regionsOf(it).join('・');const _ch=!forceWrong&&picked.has(c.dataset.id);if(isCorrect&&_ch)weakRecord(it.term,it.read,_t,true,0.5);else if(isCorrect&&!_ch)weakRecord(it.term,it.read,_t,false,0.5);else if(!isCorrect&&_ch)weakRecord(it.term,it.read,_t,false,0.5);}
      const chosen=!forceWrong && picked.has(c.dataset.id);
      if(isCorrect&&chosen){c.classList.add('correct');addBadge(c,'あなたの解答','your');addBadge(c,'正しい選択肢','ans');}
      else if(isCorrect&&!chosen){c.classList.add('correct');c.style.opacity='.7';if(!forceWrong)ok=false;addBadge(c,'正しい選択肢','ans');}
      else if(!isCorrect&&chosen){c.classList.add('wrong');ok=false;addBadge(c,'あなたの解答','your');}
      else c.classList.add('dim');
    });
    if(ok)state.correct++; else state.wrong.push({type:'ctask',key:state.pool[state.idx]});
    document.getElementById('gradeC').disabled=true;
    document.getElementById('dkC').disabled=true;
    const list=chosenCorrect.map(x=>x.term).join('、');
    // 正解の語それぞれの説明（携帯でも選択肢まで戻らずに確認できるように）
    const correctDescHTML=chosenCorrect.map(x=>{
      const ss=x.mem.map(m=>m.s&&m.s!=='その他'?`${m.r}・${m.s}`:m.r).join('／');
      return `<div style="margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)">
        <div style="font-weight:700">${x.term}<span style="font-weight:400;font-size:12px;color:var(--ink-soft)">（${x.read}）　${ss}</span></div>
        <div>${x.desc}${x.ext?`<br><span style="color:var(--ink-soft)">※ 教材外の補足：${x.ext}</span>`:''}</div></div>`;
    }).join('');
    // 誤答側の各語の所属も解説に出す（横断混同の確認用）
    const wrongInfo=wrongs.map(w=>{
      const rs=regionsOf(w).join('・');
      return `${w.term}＝${rs}`;
    }).join('、');
    const tail=ok?'すべて正しく選べています。':(forceWrong?'「わからない」を選びました。':'取りこぼし・誤選択があります。');
    document.getElementById('afterC').innerHTML=
      verdict(ok)
      +`<div class="explain"><span class="ttl">解説</span>あてはまるのは <b>${list}</b> です。${tail}${correctDescHTML}<br>
      <span style="color:var(--ink-soft)">それ以外の語の所属：${wrongInfo}</span><br><br>
      <span style="color:var(--ink-soft);font-size:12px">※ 緑＝あてはまる語、薄い緑＝選び落とした正解、赤＝誤って選んだ語。</span></div>`
      +nextBtnHTML();
    bindNext();
  }
  document.getElementById('gradeC').addEventListener('click',()=>settleC(false));
  document.getElementById('dkC').addEventListener('click',()=>settleC(true));
}

// ---- 共通：正誤の明示 ----
function verdict(ok){
  return `<div class="verdict ${ok?'ok':'ng'}"><span class="ic">${ok?'○':'×'}</span><span>${ok?'正解':'不正解'}</span></div>`;
}

// ---- 共通：次へ ----
function nextBtnHTML(){
  const last=state.idx>=state.total-1;
  return `<div class="actions"><button class="btn btn-primary" id="nextBtn">${last?'結果を見る':'次の問題へ →'}</button></div>`;
}
function bindNext(){
  const nb=document.getElementById('nextBtn');
  if(nb)nb.addEventListener('click',()=>{
    state.idx++;
    if(state.idx>=state.total)finish();
    else renderQuestion();
  });
}

function dedupWrong(arr){
  const seen=new Set(),out=[];
  arr.forEach(w=>{const k=w.type+':'+(w.id!=null?w.id:w.key);if(!seen.has(k)){seen.add(k);out.push(w);}});
  return out;
}
function ctaskPlainLabel(t){return t.label.replace(/<[^>]+>/g,'');}
function finish(){
  show('done');
  document.getElementById('doneScore').textContent=`${state.correct} / ${state.total}`;
  const r=state.total?state.correct/state.total:0;
  let msg;
  if(r===1)msg='全問正解です。';
  else if(r>=0.7)msg='よく取れています。間違えた語を確認しておきましょう。';
  else if(r>=0.4)msg='半ばまで来ています。間違えた箇所を中心に復習しましょう。';
  else msg='まずは語がどの文化圏のものかを整理し直すとよいでしょう。';
  document.getElementById('doneMsg').textContent=msg;

  const uniq=dedupWrong(state.wrong);
  const area=document.getElementById('wrongArea');
  if(uniq.length===0){
    area.innerHTML=`<div class="actions" style="justify-content:center">
      <button class="btn btn-primary" id="againBtn">同じ形式でもう一度</button>
      <button class="btn btn-ghost" id="homeBtn">形式を選び直す</button></div>`;
  }else{
    const rows=uniq.map(w=>{
      if(w.type==='ctask')return `<li><span>${ctaskPlainLabel(CTASKS[w.key])}（分類）</span><span class="rd">モードC</span></li>`;
      const d=byId(w.id);
      return `<li><span>${d.term}</span><span class="rd">${regionsOf(d).join('・')}</span></li>`;
    }).join('');
    area.innerHTML=`<div class="wrong-list">
      <div class="wl-ttl">間違えた問題（${uniq.length}件）</div>
      <ul>${rows}</ul></div>
      <div class="actions" style="justify-content:center">
        <button class="btn btn-primary" id="retryBtn">間違えた問題をもう一度（${uniq.length}問）</button>
        <button class="btn btn-ghost" id="homeBtn">セッションを終了する</button></div>`;
    document.getElementById('retryBtn').addEventListener('click',retryWrong);
  }
  const ag=document.getElementById('againBtn');if(ag)ag.addEventListener('click',()=>{buildPool();show('quiz');renderQuestion();});
  const hm=document.getElementById('homeBtn');if(hm)hm.addEventListener('click',goHome);
}
function retryWrong(){
  const uniq=dedupWrong(state.wrong);
  state.pool = state.mode==='C' ? uniq.map(w=>w.key) : uniq.map(w=>byId(w.id));
  state.idx=0;state.total=state.pool.length;state.correct=0;state.wrong=[];
  show('quiz');renderQuestion();
}
</script>
